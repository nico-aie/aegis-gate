[package]
name = "aegis-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# `redis` enables the deadpool-redis-backed `RedisBackend`. Off by
# default so single-node builds don't pull the Redis dep tree.
default = []
redis = ["dep:redis", "dep:deadpool-redis", "deadpool-redis/cluster"]
# `affinity` enables CPU-pinning of tokio worker threads at boot.
# Linux-first; macOS/Windows accept the request but kernel
# enforcement is advisory. Off by default — the runtime config
# `cpu_affinity: true` is honoured only if this feature is on.
affinity = []
# `geoip` plumbs the MaxMind GeoIP reader into the AttacksHandler
# so /api/attacks/top rows carry country + ASN. Off by default so
# builds without MaxMind DBs stay slim. Wires through to
# `aegis-security/geoip` (the actual reader implementation).
geoip = ["aegis-security/geoip"]
# AI-T5 — pulls the ONNX-runtime-backed detector from
# aegis-security so the boot path in src/run.rs can wire it
# into the chain when `cfg.ai.enabled = true`.
ai = ["aegis-security/ai", "aegis-control/ai"]
# `llm` — AI Operator Copilot provider adapters (OpenAI-compatible /
# Anthropic) in aegis-control. Without it the copilot endpoint still
# exists but reports "disabled".
llm = ["aegis-control/llm"]
# `vault` enables resolution of `${secret:vault:<path>#<field>}`
# config references against a HashiCorp Vault server. Off by
# default so single-node + non-Vault deployments stay slim.
vault = ["dep:reqwest"]
# `aws` enables resolution of
# `${secret:aws:<arn>#<field>}` against AWS Secrets Manager.
# Pulls the official AWS SDK (credential chain: env, profile,
# IMDSv2, web-identity / IRSA on EKS).
aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]
# `gcp` enables resolution of
# `${secret:gcp:projects/<proj>/secrets/<name>/versions/<ver>#<field>}`
# against GCP Secret Manager. REST-based (`reqwest` reused from
# `vault`). Auth via Application Default Credentials.
gcp = ["dep:reqwest", "dep:gcp_auth", "dep:base64"]
# `azure` enables resolution of
# `${secret:azure:<vault-name>/<secret-name>[/<version>]#<field>}`
# against Azure Key Vault. REST-based (`reqwest` reused). Auth
# via service-principal env vars or Managed Identity (IMDS) —
# hand-rolled rather than pulling the preview `azure_identity`
# crate.
azure = ["dep:reqwest"]
# `consul` enables a Consul-backed service-discovery watcher
# (`sd::consul::watch`). REST + blocking queries via reqwest;
# env-driven config (`AEGIS_CONSUL_ADDR`, optional `_TOKEN` /
# `_DATACENTER` / `_CA_CERT_PATH` for mTLS clusters).
consul = ["dep:reqwest"]
# `etcd` enables an etcd v3 REST gateway range-polling watcher
# (`sd::etcd::watch`). Reuses `reqwest` + `base64` (already
# pulled by other features). Env-driven config (`AEGIS_ETCD_ENDPOINTS`,
# optional `_USER` / `_PASSWORD` / `_CA_CERT_PATH` /
# `_CLIENT_CERT_PATH` / `_CLIENT_KEY_PATH` for auth + mTLS).
etcd = ["dep:reqwest", "dep:base64"]
# `k8s` enables a Kubernetes EndpointSlice watcher
# (`sd::k8s::watch`). REST + streaming JSON lines via reqwest;
# auto-detects in-cluster service-account creds. Env-driven
# config (`AEGIS_K8S_API_SERVER`, `AEGIS_K8S_NAMESPACE`,
# `AEGIS_K8S_TOKEN_PATH`, `AEGIS_K8S_CA_CERT_PATH`).
k8s = ["dep:reqwest"]
# `http3` adds a QUIC listener (`listener::http3`) that
# terminates HTTP/3 alongside the existing TLS listener,
# reusing the same `rustls::ServerConfig`. Off by default
# because `quinn` + `h3` pull a sizeable QUIC dep tree.
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-control = { path = "../aegis-control" }
aegis-security = { path = "../aegis-security" }
arc-swap.workspace = true
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
uuid.workspace = true
dashmap.workspace = true
# SC-1 smart cache — async, byte-weighted (weigher) in-process cache with
# TinyLFU admission (scan-resistant) + TTL/TTI. Already in the lock graph.
moka = { version = "0.12", features = ["future"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyper-rustls.workspace = true
webpki-roots.workspace = true
instant-acme.workspace = true
notify.workspace = true
rcgen.workspace = true
regex.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
x509-parser.workspace = true
sha2.workspace = true
hmac.workspace = true
ipnet.workspace = true
# PROXY-protocol v1/v2 header parsing (real client IP behind an L4
# LB). We own the bounded pre-TLS read; `ppp` parses the bytes only.
ppp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tower-service = "0.3"
futures = "0.3"
tracing.workspace = true

# PR-DNS-2 (2026-05-11) — pure-Rust async DNS resolver. Pulled
# unconditionally; used by `upstream::dns_refresh` to TTL-aware
# refresh hostname-addressed upstream members in the background.
# Without this, hostname members are resolved at boot only
# (Phase 1 shape).
hickory-resolver.workspace = true

# Optional — gated by the `redis` feature. Bringing these in
# here (rather than as workspace.dependencies pulled by every
# crate) keeps the dep tree pruned for builds that don't need
# Redis.
redis = { workspace = true, optional = true }
deadpool-redis = { workspace = true, optional = true }

# Optional — gated by the `vault` feature. Same pruning rationale.
reqwest = { workspace = true, optional = true }

# Optional — gated by the `aws` feature.
aws-config = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }

# Optional — gated by the `gcp` feature.
gcp_auth = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# Optional — gated by the `http3` feature.
quinn = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }

[dev-dependencies]
aegis-security = { path = "../aegis-security" }
futures = "0.3"
parking_lot.workspace = true
rustls-pki-types.workspace = true
tempfile = "3"
time = "0.3"
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
