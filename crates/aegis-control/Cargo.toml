[package]
name = "aegis-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Off by default. With `alerts`, `slo::dispatch::send_alert` does
# real HTTP delivery for receivers (today: VipTalk). Without it,
# the function logs and returns Ok — types still parse so an
# operator-side dispatcher can read the config.
default = []
alerts = ["dep:reqwest"]

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-security = { path = "../aegis-security" }
arc-swap.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
http.workspace = true
num_cpus.workspace = true
prometheus.workspace = true
sha2.workspace = true
thiserror.workspace = true
blake3.workspace = true
hmac.workspace = true
argon2.workspace = true
chrono.workspace = true
tracing.workspace = true
ipnet.workspace = true

# Optional — gated by the `alerts` feature.
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
parking_lot.workspace = true
tempfile = "3"
