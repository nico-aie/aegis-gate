[package]
name = "aegis-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Off by default. With `alerts`, `slo::dispatch::send_alert` does
# real HTTP delivery for receivers (today: VipTalk). Without it,
# the function logs and returns Ok — types still parse so an
# operator-side dispatcher can read the config.
default = []
alerts = ["dep:reqwest"]

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-security = { path = "../aegis-security" }
arc-swap.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
http.workspace = true
num_cpus.workspace = true
prometheus.workspace = true
sha2.workspace = true
thiserror.workspace = true
blake3.workspace = true
hmac.workspace = true
argon2.workspace = true
chrono.workspace = true
tracing.workspace = true
ipnet.workspace = true
# MTLS-T6 — IdentityTracker per-principal sliding-window counter.
# DashMap is wait-free per-shard, matches the RiskTracker pattern.
dashmap.workspace = true
parking_lot.workspace = true
# MTLS-T6 — CA bundle parsing for `/api/mtls/ca-summary`.
# Reuses the workspace versions already in aegis-proxy.
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
x509-parser.workspace = true

# HACK-T5 TLS — `audit::sinks::syslog::SyslogTransport::Tls`
# wraps the TCP stream in `tokio_rustls::TlsConnector` so audit
# events can cross untrusted networks (cloud → on-prem SIEM)
# without exposing the audit stream. webpki-roots is the
# default trust; operators with private PKI configure
# `ca_bundle:` instead.
rustls = { workspace = true, features = ["ring"] }
tokio-rustls.workspace = true
webpki-roots.workspace = true

# Optional — gated by the `alerts` feature.
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
# MTLS-T6 — `parse_ca_bundle` tests build a self-signed CA on
# the fly so we can exercise the PEM parser without a fixture.
rcgen.workspace = true
