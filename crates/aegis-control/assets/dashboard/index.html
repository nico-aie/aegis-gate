<!DOCTYPE html>
<html lang="en" data-theme="dim" data-density="compact" data-accent="yellow">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis WAF · Control Plane</title>
  <link rel="stylesheet" href="/dashboard/assets/aegis.css">
  <!-- Theme bootstrap — runs before paint to avoid a flash of
       wrong theme. Reads `aegis_theme` from localStorage; falls back
       to "dim" (the product default since 2026-06-05 — a softer dark
       that's easier to read than Midnight). Inline because the SPA
       bundle hasn't loaded yet at this point. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('aegis_theme');
        document.documentElement.dataset.theme = stored || 'dim';
      } catch (_) {
        // localStorage unavailable — keep the dim default already
        // on <html data-theme="dim">.
      }
    })();
  </script>
</head>
<body>
  <!-- React 18 mounts the SPA into #root. Pre-compiled bundle in
       app.js (built from src/*.jsx by build.sh). React + ReactDOM
       are local UMD bundles — no CDN dependency, no 'unsafe-eval'. -->
  <div id="root"></div>

  <script src="/dashboard/assets/react.min.js"></script>
  <script src="/dashboard/assets/react-dom.min.js"></script>
  <script src="/dashboard/assets/app.js"></script>
</body>
</html>
