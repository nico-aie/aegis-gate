<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Aegis WAF</title>
<!-- theme.js is a CLASSIC script (no type=module) loaded before the
     stylesheet so data-theme is set on <html> before first paint —
     prevents flash-of-wrong-theme. See docs/dashboard-enterprise/theme.md. -->
<script src="/dashboard/assets/theme.js"></script>
<link rel="stylesheet" href="/dashboard/assets/aegis.css">
<!--
  Chart.js is loaded by D-M2 with Subresource Integrity:
    <script src="/dashboard/assets/chart.umd.min.js"
            integrity="sha384-PENDING-D-M2-VENDOR"
            crossorigin="anonymous" defer></script>
  The integrity literal will be asserted against the vendored bytes
  by tests/dashboard/sri.rs once the file lands.
-->
</head>
<body class="aegis-body" data-density="comfortable" data-theme="auto">

<!--
  Inlined SVG icon sprite. Editable source mirror lives at
  /dashboard/assets/icons.svg — keep both in sync (D-M1-T1.2).
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="icon-shield" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 1.5 2.5 3.75v3.5c0 3.5 2.5 6 5.5 7.25 3-1.25 5.5-3.75 5.5-7.25v-3.5L8 1.5z"/>
    </symbol>
    <symbol id="icon-overview" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="5" height="5" rx="1"/>
      <rect x="9" y="2" width="5" height="5" rx="1"/>
      <rect x="2" y="9" width="5" height="5" rx="1"/>
      <rect x="9" y="9" width="5" height="5" rx="1"/>
    </symbol>
    <symbol id="icon-live" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="2.5"/>
      <path d="M3.5 8a4.5 4.5 0 0 1 9 0M1.5 8a6.5 6.5 0 0 1 13 0"/>
    </symbol>
    <symbol id="icon-attacks" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 13 13 3M9 3h4v4"/>
    </symbol>
    <symbol id="icon-analytics" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 13h12M3.5 11V8M6.5 11V5M9.5 11V7M12.5 11V3"/>
    </symbol>
    <symbol id="icon-audit" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 2h7l3 3v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/>
      <path d="M5.5 8h5M5.5 11h5"/>
    </symbol>
    <symbol id="icon-rules" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3h10M3 8h10M3 13h6"/>
      <circle cx="11.5" cy="13" r="1.25"/>
    </symbol>
    <symbol id="icon-tiers" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 4l6-2 6 2-6 2-6-2zM2 8l6 2 6-2M2 12l6 2 6-2"/>
    </symbol>
    <symbol id="icon-blacklist" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="6"/>
      <path d="M3.75 3.75l8.5 8.5"/>
    </symbol>
    <symbol id="icon-whitelist" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="6"/>
      <path d="M5 8.25l2 2 4-4.5"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="2"/>
      <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M3.05 12.95l1.4-1.4M11.55 4.45l1.4-1.4"/>
    </symbol>
    <symbol id="icon-tracking" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="6"/>
      <path d="M8 4v4l3 1.5"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="7" r="4.5"/>
      <path d="M10.5 10.5l3 3"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="6" r="2.75"/>
      <path d="M2.5 13.5a5.5 5.5 0 0 1 11 0"/>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="3"/>
      <path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5M3.5 3.5l1 1M11.5 11.5l1 1M3.5 12.5l1-1M11.5 4.5l1-1"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 9.5A6 6 0 1 1 6.5 2.5a5 5 0 0 0 7 7z"/>
    </symbol>
    <symbol id="icon-menu" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 4h11M2.5 8h11M2.5 12h11"/>
    </symbol>
  </defs>
</svg>

<a class="aegis-skip-link" href="#aegis-content">Skip to main content</a>

<div id="aegis-app" class="aegis-app" data-app-state="booting">

  <header class="aegis-topbar" role="banner">
    <button class="aegis-menu-button" type="button" aria-label="Toggle navigation" data-action="toggle-sidebar">
      <svg class="aegis-icon" aria-hidden="true"><use href="#icon-menu"/></svg>
    </button>
    <a class="aegis-logo" href="/dashboard/" aria-label="Aegis WAF home">
      <svg class="aegis-icon aegis-logo-icon" aria-hidden="true"><use href="#icon-shield"/></svg>
      <span class="aegis-logo-text">Aegis WAF</span>
    </a>
    <span class="aegis-version" data-slot="version" aria-label="Build version">&mdash;</span>
    <span class="aegis-env" data-slot="environment" aria-label="Environment">&mdash;</span>
    <div class="aegis-topbar-spacer"></div>
    <button class="aegis-search" type="button" aria-label="Open command palette" data-action="open-cmdk">
      <svg class="aegis-icon" aria-hidden="true"><use href="#icon-search"/></svg>
      <span class="aegis-search-label" data-i18n="topbar.search">Search</span>
      <kbd class="aegis-kbd">⌘K</kbd>
    </button>
    <span class="aegis-health" data-slot="health" aria-live="polite" aria-label="System health">
      <span class="aegis-health-dot" data-state="unknown"></span>
    </span>
    <details class="aegis-user-menu" data-slot="user-menu">
      <summary aria-label="Account menu">
        <svg class="aegis-icon" aria-hidden="true"><use href="#icon-user"/></svg>
      </summary>
      <div class="aegis-user-menu-panel" role="menu">
        <button type="button" role="menuitem" data-action="toggle-theme">
          <svg class="aegis-icon" aria-hidden="true"><use href="#icon-sun"/></svg>
          <span data-i18n="topbar.theme">Theme</span>
        </button>
        <form method="post" action="/admin/logout">
          <button type="submit" role="menuitem" data-i18n="topbar.signout">Sign out</button>
        </form>
      </div>
    </details>
  </header>

  <nav class="aegis-sidebar" role="navigation" aria-label="Primary">
    <ul class="aegis-nav-section" aria-labelledby="aegis-section-operator">
      <li id="aegis-section-operator" class="aegis-nav-heading" data-i18n="sidebar.operator">Operator</li>
      <li><a href="/dashboard/overview" data-route="overview"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-overview"/></svg><span data-i18n="nav.overview">Overview</span></a></li>
      <li><a href="/dashboard/live" data-route="live"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-live"/></svg><span data-i18n="nav.live">Live Feed</span></a></li>
      <li><a href="/dashboard/attacks" data-route="attacks"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-attacks"/></svg><span data-i18n="nav.attacks">Attack Events</span></a></li>
      <li><a href="/dashboard/analytics" data-route="analytics"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-analytics"/></svg><span data-i18n="nav.analytics">Analytics</span></a></li>
      <li><a href="/dashboard/audit" data-route="audit"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-audit"/></svg><span data-i18n="nav.audit">Audit Log</span></a></li>
    </ul>
    <ul class="aegis-nav-section" aria-labelledby="aegis-section-config">
      <li id="aegis-section-config" class="aegis-nav-heading" data-i18n="sidebar.config">Configuration</li>
      <li><a href="/dashboard/rules" data-route="rules"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-rules"/></svg><span data-i18n="nav.rules">Rule Manager</span></a></li>
      <li><a href="/dashboard/tiers" data-route="tiers"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-tiers"/></svg><span data-i18n="nav.tiers">Tier Config</span></a></li>
      <li><a href="/dashboard/blacklist" data-route="blacklist"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-blacklist"/></svg><span data-i18n="nav.blacklist">Blacklist</span></a></li>
      <li><a href="/dashboard/whitelist" data-route="whitelist"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-whitelist"/></svg><span data-i18n="nav.whitelist">Whitelist</span></a></li>
      <li><a href="/dashboard/settings" data-route="settings"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-settings"/></svg><span data-i18n="nav.settings">Settings</span></a></li>
    </ul>
    <ul class="aegis-nav-section" aria-labelledby="aegis-section-tracking">
      <li id="aegis-section-tracking" class="aegis-nav-heading" data-i18n="sidebar.tracking">Tracking</li>
      <li><a href="/dashboard/tracking" data-route="tracking"><svg class="aegis-icon" aria-hidden="true"><use href="#icon-tracking"/></svg><span data-i18n="nav.tracking">Tracking</span></a></li>
    </ul>
  </nav>

  <main id="aegis-content" class="aegis-content" role="main" tabindex="-1">
    <div class="aegis-page-mount" data-slot="page">
      <noscript>
        <p data-i18n="noscript.message">This dashboard requires JavaScript to render.</p>
      </noscript>
    </div>
  </main>

  <footer class="aegis-statusbar" role="contentinfo">
    <span class="aegis-status-item" data-slot="connection" aria-live="polite">
      <span class="aegis-status-dot" data-state="disconnected"></span>
      <span data-i18n="status.disconnected">Disconnected</span>
    </span>
    <span class="aegis-status-item" data-slot="cluster">
      <span data-i18n="status.cluster">Cluster</span>
      <span data-slot="cluster-count">&mdash;</span>
    </span>
    <span class="aegis-status-item" data-slot="last-sync">
      <span data-i18n="status.lastSync">Last sync</span>
      <span data-slot="sync-time">&mdash;</span>
    </span>
    <span class="aegis-status-item" data-slot="audit-chain">
      <span data-i18n="status.auditChain">Audit chain</span>
      <span class="aegis-status-dot" data-state="unknown"></span>
    </span>
  </footer>

</div>

<div id="aegis-toasts" class="aegis-toasts" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="/dashboard/assets/app.js"></script>
</body>
</html>
