[package]
name = "aegis-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Off by default. With `taxii`, `threat_intel::taxii` exposes a
# real TAXII 2.1 client + background fetcher loop that feeds
# `ThreatIntelStore`. Without it, the module is absent — the
# store still exists for in-memory / file-loaded feeds.
default = []
taxii = ["dep:reqwest"]
# Off by default. With `geoip`, `geoip::MaxMindReader` opens
# MaxMind `.mmdb` files (Country + ASN); without it, the
# `geoip` module is absent. The new rule-engine
# `country` / `asn` conditions still parse — they just
# evaluate to false when no reader is wired.
geoip = ["dep:maxminddb"]
# Off by default. With `ai`, `detectors::ai::AiDetector` is
# compiled in and the `tract-onnx` runtime is pulled. Without
# it, the AI detector module is absent and `cfg.ai.enabled =
# true` triggers a boot-time error so operators see the
# misconfiguration loudly. Adds ~50 MB to the release binary.
ai = ["dep:tract-onnx"]

[dependencies]
aegis-core = { path = "../aegis-core" }
arc-swap.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
http.workspace = true
ipnet.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true

# Optional — gated by the `taxii` feature.
reqwest = { workspace = true, optional = true }

# Optional — gated by the `geoip` feature.
maxminddb = { workspace = true, optional = true }

# Optional — gated by the `ai` feature.
tract-onnx = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
