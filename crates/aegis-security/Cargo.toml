[package]
name = "aegis-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Off by default. With `taxii`, `threat_intel::taxii` exposes a
# real TAXII 2.1 client + background fetcher loop that feeds
# `ThreatIntelStore`. Without it, the module is absent — the
# store still exists for in-memory / file-loaded feeds.
default = []
taxii = ["dep:reqwest"]
# Off by default. With `geoip`, `geoip::MaxMindReader` opens
# MaxMind `.mmdb` files (Country + ASN); without it, the
# `geoip` module is absent. The new rule-engine
# `country` / `asn` conditions still parse — they just
# evaluate to false when no reader is wired.
geoip = ["dep:maxminddb"]
# Off by default. With `ai`, `detectors::ai::AiDetector` is
# compiled in and the ONNX Runtime (`ort` crate) is pulled.
# Without it, the AI detector module is absent and
# `cfg.ai.enabled = true` triggers a boot-time error so
# operators see the misconfiguration loudly.  ORT downloads
# its native binary at first build (~50 MB) so the operator
# doesn't need to wrestle with a system-wide install.
ai = ["dep:ort", "dep:ndarray", "dep:async-channel"]
# Off by default. With `ai-remote`,
# `detectors::ai::remote::RemoteAiDetector` is compiled in — a gRPC
# client to the standalone `aegis-infer` batch inference server
# (`data/serving-server/`). Pulls `tonic` + `prost` and compiles the
# proto at build time (vendored protoc, no system protobuf needed).
# Independent of `ai` (in-process ONNX): a build can have either, both,
# or neither. See `data/serving-server/INTEGRATION.md`.
ai-remote = ["dep:tonic", "dep:prost", "dep:hyper-util", "dep:tower"]

[dependencies]
aegis-core = { path = "../aegis-core" }
arc-swap.workspace = true
async-trait.workspace = true
# 2026-05-18 (QC Sprint 2.3 — F-CRITICAL-014): RFC 7617 Basic-auth
# username extraction in `brute_force::extract_username`.
base64.workspace = true
blake3.workspace = true
bytes = { workspace = true }
chrono.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
http.workspace = true
ipnet.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Optional — gated by the `taxii` feature.
reqwest = { workspace = true, optional = true }

# Optional — gated by the `geoip` feature.
maxminddb = { workspace = true, optional = true }

# Optional — gated by the `ai` feature.
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
# In-process batch accumulator (detectors::ai::batch) — MPMC work queue
# from the collector to the worker tasks. Version matches the standalone
# serving server (data/serving-server/Cargo.toml).
async-channel = { version = "2", optional = true }

# Optional — gated by the `ai-remote` feature (gRPC client to the
# aegis-infer serving server). Versions pinned to match the server crate
# (data/serving-server/Cargo.toml).
tonic = { version = "0.12", features = ["transport"], optional = true }
prost = { version = "0.13", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tower = { version = "0.4", optional = true }

# Build-time proto compilation — only does work when `ai-remote` is on
# (see build.rs); the vendored protoc means no system protobuf-compiler.
[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
