syntax = "proto3";
package aegis.infer.v1;

// ─── Service ────────────────────────────────────────────────────────────────

service AegisInfer {
  // Classify a single HTTP request.
  // Internally the server accumulates a batch (up to delay_ms or max_batch)
  // before running ONNX inference, so latency ≤ delay_ms + infer_time.
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);

  // Health check — returns server mode and worker count.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Runtime statistics — batch sizes, latency, attack counts.
  rpc Stats(StatsRequest) returns (StatsResponse);
}

// ─── Classify ───────────────────────────────────────────────────────────────

message ClassifyRequest {
  // Optional correlation ID; echoed back in ClassifyResponse.
  string request_id = 1;

  // Option A — pre-extracted feature vector (exactly 27 floats).
  // If len == 27, used directly; feature extraction is skipped.
  repeated float features = 2;

  // Option B — raw HTTP request string in the format:
  //   "METHOD /path?query body\nUser-Agent: …\nCookie: …\nReferer: …"
  // Used only when `features` is empty.
  string raw_request = 3;
}

message ClassifyResponse {
  string request_id = 1;

  // P(Attack) ∈ [0, 1].  Threshold configurable via --threshold (default 0.5).
  float  prob_attack  = 2;

  // True when prob_attack >= threshold.
  bool   is_attack    = 3;

  // Number of requests processed in the same batch as this request.
  // Useful for tuning --delay-ms and --max-batch.
  uint32 batch_size   = 4;

  // Total ONNX inference wall-clock time for the batch (microseconds).
  uint32 infer_us     = 5;

  // Time from request received to inference start (queue wait, milliseconds).
  float  queue_ms     = 6;
}

// ─── Health ─────────────────────────────────────────────────────────────────

message HealthRequest {}

message HealthResponse {
  bool   ok        = 1;
  string mode      = 2;   // "onnx" | "mock"
  uint32 workers   = 3;
  uint32 max_batch = 4;
  float  delay_ms  = 5;
}

// ─── Stats ───────────────────────────────────────────────────────────────────

message StatsRequest {}

message StatsResponse {
  uint64 total_requests  = 1;   // individual classify calls
  uint64 total_batches   = 2;   // ONNX forward passes
  double avg_batch_size  = 3;   // total_requests / total_batches
  double avg_infer_us    = 4;   // mean per-batch ONNX latency (µs)
  uint64 total_attacks   = 5;   // requests where is_attack == true
  uint32 max_batch_seen  = 6;   // largest single batch
  uint64 uptime_secs     = 7;
}
