[package]
name = "aegis-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "waf"
path = "src/main.rs"

[features]
# `redis` flips on `aegis-proxy/redis`, which compiles the
# real RedisBackend into the data plane. Default is off so a
# single-node build stays slim. Enable with:
#   cargo build -p aegis-bin --features redis
default = []
redis = ["aegis-proxy/redis"]

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-proxy = { path = "../aegis-proxy" }
aegis-security = { path = "../aegis-security" }
aegis-control = { path = "../aegis-control" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
