[package]
name = "aegis-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "waf"
path = "src/main.rs"

[features]
# `redis` flips on `aegis-proxy/redis`, which compiles the
# real RedisBackend into the data plane. Default is off so a
# single-node build stays slim. Enable with:
#   cargo build -p aegis-bin --features redis
default = []
redis = ["aegis-proxy/redis"]
# `affinity` enables CPU-pinning of tokio worker threads. Honours
# `runtime.cpu_affinity: true`. Off by default — the dependency
# only links on Linux/BSD/macOS/Windows hosts, but enforcement
# semantics differ.
affinity = ["dep:core_affinity", "aegis-proxy/affinity"]
# `alerts` flips on real HTTP delivery for SLO alerts via
# `aegis-control::slo::dispatch::send_alert`. Default ships
# the in-process variant that logs the alert and counts it as
# "external" so an off-box dispatcher can pick it up. Enable
# with: `cargo build -p aegis-bin --features "redis alerts"`.
alerts = ["aegis-control/alerts"]
# `geoip` enriches /api/attacks/top with country + ASN per
# attacker. Requires MaxMind .mmdb files at the paths configured
# in `geoip.country_db` / `geoip.asn_db`. Without these DBs the
# lookups silently return None and the API drops the fields.
geoip = ["aegis-proxy/geoip"]
# `ai` compiles in the ML-based detector backed by `tract-onnx`.
# Operator-supplied ONNX model loaded from `cfg.ai.model_path`
# at boot. Off by default — enabling adds ~50 MB to the binary
# and requires the operator to ship a model artifact. AI-T1.
ai = ["aegis-security/ai", "aegis-proxy/ai", "aegis-control/ai"]
# `vault`, `aws`, `gcp`, `azure` — cloud secret-resolver
# adapters. Each opts in to a single-cloud SDK. Combine freely.
vault = ["aegis-proxy/vault"]
aws    = ["aegis-proxy/aws"]
gcp    = ["aegis-proxy/gcp"]
azure  = ["aegis-proxy/azure"]
# `consul`, `etcd`, `k8s` — service-discovery adapters.
consul = ["aegis-proxy/consul"]
etcd   = ["aegis-proxy/etcd"]
k8s    = ["aegis-proxy/k8s"]
# `http3` — QUIC listener (quinn 0.11 + h3 0.0.8 + h3-quinn).
http3 = ["aegis-proxy/http3"]
# `taxii` — STIX/TAXII threat-intel fetch loop.
taxii = ["aegis-security/taxii"]
# `otel` — OpenTelemetry OTLP exporter for distributed tracing.
# Enables the OTLP gRPC exporter that ships every `tracing` span
# emitted by the WAF to the configured collector
# (cfg.observability.otel.endpoint). The 4 dep set is the standard
# OTel-Rust trace stack — version-pinned together because the
# inter-crate API breaks on minor bumps.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# `tokio_unstable` — registers the four runtime-metrics gauges
# (aegis_runtime_active_workers, aegis_runtime_blocking_threads,
#  aegis_runtime_blocking_queue_depth, aegis_runtime_io_driver_fd_count)
# on /metrics. SC-T4. Requires building with
#   RUSTFLAGS="--cfg tokio_unstable"
# to actually populate the gauges (the cfg flag opts in to
# tokio's non-SemVer runtime-metrics API). Without the rustc
# cfg, the gauges register but always read zero. Default off:
# operators opt in for the additional observability when they
# accept tokio's non-SemVer guarantees on this surface.
tokio_unstable = []

# `production` — full feature set the `deploy/Dockerfile` ships.
# Operators who want a slimmer image can drop individual features
# (e.g. `aws-only` deployments don't need `gcp` + `azure` +
# `vault`). Build with:
#   cargo build -p aegis-bin --release --features production
production = [
    "redis",
    "alerts",
    "geoip",
    "ai",
    "taxii",
    "http3",
    "vault",
    "aws",
    "gcp",
    "azure",
    "consul",
    "etcd",
    "k8s",
]

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-proxy = { path = "../aegis-proxy" }
aegis-security = { path = "../aegis-security" }
aegis-control = { path = "../aegis-control" }
tokio.workspace = true
arc-swap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
core_affinity = { version = "0.8", optional = true }
# OTEL-T2 — OpenTelemetry stack. Pinned together; the four
# crates' APIs ratchet in lockstep on minor bumps.
opentelemetry         = { version = "0.24", optional = true }
opentelemetry_sdk     = { version = "0.24", features = ["rt-tokio"], optional = true }
opentelemetry-otlp    = { version = "0.17", features = ["grpc-tonic", "trace"], optional = true }
tracing-opentelemetry = { version = "0.25", optional = true }

[dev-dependencies]
tempfile = "3"
