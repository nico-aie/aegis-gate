[package]
name = "aegis-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "waf"
path = "src/main.rs"

[features]
# `redis` flips on `aegis-proxy/redis`, which compiles the
# real RedisBackend into the data plane. Default is off so a
# single-node build stays slim. Enable with:
#   cargo build -p aegis-bin --features redis
default = []
redis = ["aegis-proxy/redis"]
# `affinity` enables CPU-pinning of tokio worker threads. Honours
# `runtime.cpu_affinity: true`. Off by default — the dependency
# only links on Linux/BSD/macOS/Windows hosts, but enforcement
# semantics differ.
affinity = ["dep:core_affinity", "aegis-proxy/affinity"]
# `alerts` flips on real HTTP delivery for SLO alerts via
# `aegis-control::slo::dispatch::send_alert`. Default ships
# the in-process variant that logs the alert and counts it as
# "external" so an off-box dispatcher can pick it up. Enable
# with: `cargo build -p aegis-bin --features "redis alerts"`.
alerts = ["aegis-control/alerts"]
# `geoip` enriches /api/attacks/top with country + ASN per
# attacker. Requires MaxMind .mmdb files at the paths configured
# in `geoip.country_db` / `geoip.asn_db`. Without these DBs the
# lookups silently return None and the API drops the fields.
geoip = ["aegis-proxy/geoip"]

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-proxy = { path = "../aegis-proxy" }
aegis-security = { path = "../aegis-security" }
aegis-control = { path = "../aegis-control" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
core_affinity = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
