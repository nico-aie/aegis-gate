[package]
name = "waf-infer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "waf-infer"
path = "src/main.rs"

[[bin]]
name = "predict"
path = "src/bin/predict.rs"

[dependencies]
# ONNX Runtime — downloads ORT binary automatically on first build
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
ndarray = "0.17"

# Feature extraction
regex = "1.10"
once_cell = "1.19"
rayon = "1.10"

# Data loading + label map
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
