# Aegis-Gate WAF — Production template
# Fork this file, then edit the blocks marked "REPLACE FOR PRODUCTION".
# Field-by-field reference: config/README.md.
#
# First-time setup:
#   bash config/gen-cert.sh         # generates config/certs/dev.{crt,key}
#   target/release/waf run --config config/prod.yaml

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------
listeners:
  data:
    - bind: "0.0.0.0:8443"
      tls: true
    - bind: "0.0.0.0:8080"
      tls: false
  admin:
    bind: "127.0.0.1:9443"

# ---------------------------------------------------------------------------
# TLS — REPLACE FOR PRODUCTION
# ---------------------------------------------------------------------------
# The default points at the self-signed cert generated by
# `bash config/gen-cert.sh` (subject CN=aegis-gate.local, SANs:
# localhost / 127.0.0.1 / ::1). Good for first-light testing only.
#
# For production, either:
#   A. Replace `certificates:` with paths to real CA-issued certs:
#        certificates:
#          - cert_path: "/etc/aegis/certs/api.example.com.pem"
#            key_ref:   "/etc/aegis/certs/api.example.com.key"
#            hosts:     ["api.example.com"]
#
#   B. Comment out `certificates:` and uncomment the `acme:` block to
#      get automatic Let's Encrypt issuance + renewal.
# ---------------------------------------------------------------------------
tls:
  min_version: "1.2"
  certificates:
    - cert_path: "config/certs/dev.crt"
      key_ref:   "config/certs/dev.key"
      hosts:     ["localhost", "aegis-gate.local"]
  hsts:
    max_age: 31536000   # 1 year, in seconds (RFC 6797)
    include_subdomains: true
    preload: false
  # acme:
  #   contacts:      ["ops@example.com"]
  #   domains:       ["api.example.com"]
  #   storage:       "/var/lib/aegis/acme"
  #   directory_url: "https://acme-v02.api.letsencrypt.org/directory"

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
routes:
  - id: login
    host: "api.example.com"
    path: "/login"
    match_type: exact
    methods: [POST]
    upstream: auth-pool
    tier_override: critical

  - id: api
    host: "api.example.com"
    path: "/api/"
    match_type: prefix
    upstream: backend-pool
    tier_override: high

  - id: static
    path: "/static/"
    match_type: prefix
    upstream: static-pool
    tier_override: medium

  - id: catch-all
    path: "/"
    match_type: prefix
    upstream: backend-pool

# ---------------------------------------------------------------------------
# Upstream pools
# ---------------------------------------------------------------------------
upstreams:
  auth-pool:
    members:
      - addr: "127.0.0.1:3001"
        weight: 1
    lb: round_robin
    health:
      path: "/healthz"
      interval: "10s"
      timeout: "3s"
    circuit_breaker:
      error_rate_threshold: 0.5
      open_duration: "30s"

  backend-pool:
    members:
      - addr: "127.0.0.1:3002"
        weight: 3
      - addr: "127.0.0.1:3003"
        weight: 1
    lb: weighted_round_robin

  static-pool:
    members:
      - addr: "127.0.0.1:3004"
    lb: round_robin

# ---------------------------------------------------------------------------
# State backend — Redis. Required for cluster deployments (shared
# rate-limit counters + leader-lease) and recommended for single-node
# too because hot-reload survives without losing in-flight state.
# Replace the URL with your real Redis (sentinel / cluster / managed).
# ---------------------------------------------------------------------------
state:
  backend: redis
  redis:
    urls: ["redis://127.0.0.1:6379"]   # REPLACE FOR PRODUCTION
    pool_size: 32
    timeout: "100ms"

# ---------------------------------------------------------------------------
# Rules
# ---------------------------------------------------------------------------
rules:
  paths:
    - "config/rules/"
  max_rule_count: 10000
  strict_compile: false

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
rate_limit:
  buckets:
    - id: global-ip
      scope: global
      key: ip
      algo: sliding_window
      limit: 100
      window: "1m"

    - id: login-ip
      scope: route
      key: ip
      algo: sliding_window
      limit: 5
      window: "1m"

# ---------------------------------------------------------------------------
# Risk scoring
# ---------------------------------------------------------------------------
risk:
  weights:
    bad_asn: 15
    bad_ja4: 10
    failed_auth: 20
    detector_hit: 25
    bot_unknown: 10
    repeat_offender: 15
  decay_half_life: "5m"
  thresholds:
    challenge_at: 40
    block_at: 80
    max: 100

# ---------------------------------------------------------------------------
# Detectors
# ---------------------------------------------------------------------------
detectors:
  sqli:
    enabled: true
  xss:
    enabled: true
  path_traversal:
    enabled: true
  ssrf:
    enabled: true
  header_injection:
    enabled: true
  body_abuse:
    enabled: true
  recon:
    enabled: true
  brute_force:
    enabled: true

# ---------------------------------------------------------------------------
# DLP
# ---------------------------------------------------------------------------
dlp:
  patterns: []
  max_scan_bytes: 2097152

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
observability:
  prometheus:
    path: "/metrics"
  access_log:
    format: json
    sink: stdout

# ---------------------------------------------------------------------------
# Audit
# ---------------------------------------------------------------------------
audit:
  sinks: []
  chain:
    enabled: true
  retention: "90d"
  pseudonymize_ip: false

# ---------------------------------------------------------------------------
# Admin
# ---------------------------------------------------------------------------
admin:
  bind: "127.0.0.1:9443"
  dashboard_auth:
    password_hash_ref: "${secret:env:AEGIS_ADMIN_PASSWORD_HASH}"
    csrf_secret_ref: "${secret:env:AEGIS_CSRF_SECRET}"
    session_ttl_idle: "30m"
    session_ttl_absolute: "8h"
    ip_allowlist:
      - "127.0.0.1/32"
      - "::1/128"
    totp_enabled: false
    login_rate_limit:
      per_ip:
        limit: 5
        window: "1m"
      per_user:
        limit: 10
        window: "15m"
    lockout:
      threshold: 10
      window: "15m"
      duration: "15m"

# ---------------------------------------------------------------------------
# Benchmark mode (off by default — see docs/benchmark-mode.md)
# ---------------------------------------------------------------------------
# Exposes per-request WAF diagnostics on X-Aegis-* response headers and
# dashboard panels. Two-factor gate: source IP allowlist AND a presigned
# token header. Always-on X-Aegis-Request-Id is independent of this block.
#
# benchmark:
#   mode: disabled                   # disabled | headers | verbose
#   source_allowlist:
#     - "127.0.0.1/32"
#     - "10.0.0.0/8"
#   required_header:
#     name: "X-Aegis-Bench-Token"
#     secret_ref: "${secret:env:AEGIS_BENCH_TOKEN}"
#     signing_window: "60s"
#   ttl: "1h"                        # auto-disable countdown
#   max_ttl: "24h"                   # cap on per-call ttl
#   expose_rule_ids: false           # verbose mode only when true
#   detectors_header: true
#   pipeline_header: true


# ---------------------------------------------------------------------------
# Runtime sizing (Layer-1 of the three-layer scaling model)
# ---------------------------------------------------------------------------
# Tunes the tokio runtime at boot. Restart-only — changes here require
# a process restart (the runtime is fixed once the binary boots).
#
# - workers: "auto" (= num_cpus, lifted to >= 2) OR a fixed integer
#   in [2, 512]. The cluster heartbeat + roster pollers reserve a
#   thread, so 1 is rejected.
# - blocking_threads: tokio's blocking-pool ceiling. Default 512.
# - cpu_affinity: pin worker threads to distinct CPU cores. Honoured
#   only when the binary is built with `--features affinity`; ignored
#   with a log line otherwise.
# - stack_size_kb: per-thread stack. Tokio default is 2048 (2 MiB).
#
# runtime:
#   workers: auto
#   blocking_threads: 512
#   cpu_affinity: false
#   stack_size_kb: 2048
