# Aegis-Gate — Test-harness configuration (sibling to waf.dev.yaml)
#
# Differs from waf.dev.yaml only where the **k6 + tests/api**
# layers need a different shape than dev. Everything else (admin
# credentials, audit sink, in-memory state, detector mask) is
# identical, so day-to-day development uses dev.yaml unchanged.
#
# Required overrides:
#   - load_mode thresholds tuned so `loadmode-degradation.js`
#     can drive a laptop-bound k6 runner past `critical_rps`
#     within 8 s without dropping iterations.
#
# DO NOT use this config in production (same warning as
# waf.dev.yaml — credentials are inline, rate limits are loose).
#
# Bring-up:
#   target/release/waf run --config config/waf.test.yaml &
#
# Used by:
#   tests/load/loadmode-degradation.js   (P7 mode-elevation test)
#   tests/load/risk-strikes.js           (P6 strikes — accepts either)
#   tests/load/security-toggle-flips.js  (P2 mask flip — accepts either)
#   tests/load/verbosity-pin.js          (P8 verbosity — accepts either)

listeners:
  data:
    - bind: "0.0.0.0:8080"
      tls: false
  admin:
    bind: "127.0.0.1:9443"

routes:
  - id: catch-all
    path: "/"
    match_type: prefix
    upstream: stub-pool

upstreams:
  stub-pool:
    members:
      - addr: "127.0.0.1:9999"
    lb: round_robin

state:
  backend: in_memory

detectors:
  sqli:             { enabled: true }
  xss:              { enabled: true }
  path_traversal:   { enabled: true }
  ssrf:             { enabled: true }
  header_injection: { enabled: true }
  body_abuse:       { enabled: true }
  recon:            { enabled: true }
  brute_force:      { enabled: true }

risk:
  weights:
    bad_asn: 15
    bad_ja4: 10
    failed_auth: 20
    detector_hit: 25
    bot_unknown: 10
    repeat_offender: 15
  decay_half_life: "5m"
  thresholds:
    challenge_at: 40
    block_at:     80
    max:          100
  trust_recovery:
    per_hour: 30
  strikes:
    block_at: 50

# ---------------------------------------------------------------------------
# THE DIFF FROM waf.dev.yaml — load_mode thresholds tuned for k6
# ---------------------------------------------------------------------------
# Dev defaults (waf.dev.yaml):
#   elevated_rps: 2000   critical_rps: 8000
# Laptop k6 sustains roughly 7 000 RPS through the WAF + Docker
# overhead, so the dev numbers leave Critical unreachable.
# These numbers put Critical solidly in range of `loadmode-
# degradation.js`'s stage C (3 000 RPS configured, target).
load_mode:
  elevated_rps:    500
  critical_rps:    2000
  sample_interval: 1s
  hysteresis:      0.10

logging:
  verbosity: info

audit:
  sinks:
    - jsonl:
        path: "/tmp/aegis-test-audit.jsonl"
  chain:
    enabled: true
  retention: "7d"
  pseudonymize_ip: false

rate_limit:
  buckets:
    - id: global-ip
      scope: global
      key: ip
      algo: sliding_window
      limit: 10000
      window: "1m"

rules:
  paths: []
  max_rule_count: 10000
  strict_compile: false

observability:
  prometheus:
    path: "/metrics"
  access_log:
    format: json
    sink: stdout

admin:
  bind: "127.0.0.1:9443"
  dashboard_auth:
    password_hash_ref: '$argon2id$v=19$m=19456,t=2,p=1$DfRgVNq6Cb+eN3BEMmExAQ$69SVZBNpMFjN4evfN8g+U5jnmP56Gwx3AGaZFr32ZzY'
    csrf_secret_ref:   "test-csrf-secret-do-not-use-in-production-32b"
    session_ttl_idle: "30m"
    session_ttl_absolute: "8h"
    ip_allowlist:
      - "127.0.0.1/32"
      - "::1/128"
    totp_enabled: false
    login_rate_limit:
      per_ip:
        limit: 100
        window: "1m"
      per_user:
        limit: 200
        window: "15m"
    lockout:
      threshold: 50
      window: "15m"
      duration: "5m"
