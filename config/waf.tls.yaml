# Aegis-Gate — Data-plane TLS test fixture (carry-over 5)
#
# Mirrors waf.test.yaml but flips the data-plane listener to
# TLS:8443 and points at the self-signed cert in
# tests/fixtures/tls/. Used by tests/load/tls-baseline.js to
# exercise the HTTPS data-plane path end-to-end.
#
# DO NOT use this config in production:
#   - the cert is self-signed
#   - the key is in version control
#   - admin password is the test default

listeners:
  data:
    - bind: "0.0.0.0:8443"
      tls: true
  admin:
    bind: "127.0.0.1:9443"

routes:
  - id: catch-all
    path: "/"
    match_type: prefix
    upstream: stub-pool

upstreams:
  stub-pool:
    members:
      - addr: "127.0.0.1:8081"
    lb: round_robin

# Carry-over 5 wired this through to the listener — when the
# data listener has tls: true and tls.certificates is non-empty,
# the proxy builds a `tokio_rustls::TlsAcceptor` once and uses
# it for every accepted connection on that listener.
tls:
  certificates:
    - cert_path: "tests/fixtures/tls/cert.pem"
      key_ref: "tests/fixtures/tls/key.pem"
      hosts: ["127.0.0.1", "localhost"]
  min_version: "1.2"

state:
  backend: in_memory

detectors:
  sqli:             { enabled: true }
  xss:              { enabled: true }
  path_traversal:   { enabled: true }
  ssrf:             { enabled: true }
  header_injection: { enabled: true }
  body_abuse:       { enabled: true }
  recon:            { enabled: true }
  brute_force:      { enabled: true }

risk:
  weights:
    bad_asn: 15
    bad_ja4: 10
    failed_auth: 20
    detector_hit: 25
    bot_unknown: 10
    repeat_offender: 15
  decay_half_life: "5m"
  thresholds:
    challenge_at: 40
    block_at:     80
    max:          100
  trust_recovery:
    per_hour: 30
  strikes:
    block_at: 50

rate_limit:
  buckets:
    - id: global-ip
      scope: global
      key: ip
      algo: sliding_window
      limit: 10000
      window: "1m"

rules:
  paths: []
  max_rule_count: 10000
  strict_compile: false

observability:
  prometheus:
    path: "/metrics"
  access_log:
    format: json
    sink: stdout
