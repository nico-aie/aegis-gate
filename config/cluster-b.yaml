# Aegis-Gate — Cluster Node B (HA test fixture)
#
# See `cluster-a.yaml` for orientation. Only the bind ports
# differ; both nodes target the same Redis primary so per-IP
# rate-limit counters + block lists are shared.

# HA-T3 — stable node identity, see cluster-a.yaml.
# -----------------------------------------------------------------------------
# CONFIG LAYOUT  (H2a -- see config/README.md "Bootstrap vs Dynamic")
#   BOOTSTRAP  -- file/env only, edit + RESTART to change:
#     listeners, state, node, cluster, config_plane, runtime, admin,
#     interop, geoip, proxy, load_shedder, load_mode, logging
#   DYNAMIC    -- live-editable via API/dashboard; the doc is the source of
#                 truth and this file only SEEDS + publishes it:
#     routes, upstreams, tls, zero_trust, rules, rate_limit, risk, detectors,
#     bots, dlp, response_filter, observability, audit, compliance, tiers,
#     alerting, ai, ddos, fail_mode_by_tier, streaming, graphql
#   NB: state.backend (Redis) is ALWAYS required for the data plane.
# -----------------------------------------------------------------------------

node:
  id: "waf-b"

listeners:
  data:
    - bind: "0.0.0.0:8090"
      tls: false
  admin:
    bind: "127.0.0.1:9543"

# 2026-05-29 — see cluster-a.yaml for the same block + rationale.
# Both nodes must accept the same admin creds so cluster-wide tests
# can log into either side. Hash is for `aegis-test-1234`.
admin:
  dashboard_auth:
    password_hash_ref: '$argon2id$v=19$m=19456,t=2,p=1$DfRgVNq6Cb+eN3BEMmExAQ$69SVZBNpMFjN4evfN8g+U5jnmP56Gwx3AGaZFr32ZzY'
    csrf_secret_ref:   "test-csrf-secret-do-not-use-in-production-32b"
    session_ttl_idle: "30m"
    session_ttl_absolute: "8h"
    ip_allowlist:
      - "127.0.0.1/32"
      - "::1/128"
    totp_enabled: false
    # TOTP-2 (TF-1) — EXPLICIT dev/CI opt-out from the enforced-by-default
    # 2FA policy. Without this line a password-only login only reaches the
    # TOTP-enrollment surface. Never ship false to production.
    require_totp: false

# 2026-05-30 — see cluster-a.yaml for the same block + rationale.
ai:
  enabled: true
  model_path: "data/ai_model/waf_model.onnx"
  confidence_threshold: 0.85

routes:
  - id: catch-all
    path: "/"
    match_type: prefix
    upstream: stub-pool

upstreams:
  stub-pool:
    members:
      - addr: "127.0.0.1:8081"
    lb: round_robin

state:
  backend: redis
  redis:
    urls: ["redis://127.0.0.1:6379"]
    pool_size: 8
    timeout: "1s"
  reconcile:
    readiness_warm_ms: "5s"

# Leaderless multi-node console sync (cluster plan Phases 2 & 3) —
# must match cluster-a.yaml so both nodes share the same fleet channel
# + snapshot keyspace. See cluster-a.yaml for the rationale.
cluster:
  fleet_events:
    enabled: true
  fleet_view:
    enabled: true
    publish_interval_ms: 1000
    snapshot_ttl_ms: 5000
  pubsub_nudge: true   # Phase 5 — see cluster-a.yaml

detectors:
  sqli:             { enabled: true }
  xss:              { enabled: true }
  path_traversal:   { enabled: true }
  ssrf:             { enabled: true }
  header_injection: { enabled: true }
  body_abuse:       { enabled: true }
  recon:            { enabled: true }
  brute_force:      { enabled: true }

risk:
  weights:
    bad_asn: 15
    bad_ja4: 10
    failed_auth: 20
    detector_hit: 25
    bot_unknown: 10
    repeat_offender: 15
  decay_half_life: "5m"
  thresholds:
    challenge_at: 40
    block_at:     80
    max:          100
  trust_recovery:
    per_hour: 30
  strikes:
    block_at: 50

rate_limit:
  buckets:
    - id: global-ip
      scope: global
      key: ip
      algo: sliding_window
      # Set high so HA load tests can measure failover budget
      # without the rate-limit dominating the result. Production
      # operators with real DDoS budgets set this much lower.
      limit: 10000000
      window: "1m"

rules:
  paths: []
  max_rule_count: 10000
  strict_compile: false

observability:
  prometheus:
    path: "/metrics"
  access_log:
    format: json
    sink: stdout
