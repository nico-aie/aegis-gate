# Aegis-Gate — Profile: prod-high-throughput
#
# === When to use ===
# Throughput-first deployments where p99 budget is tighter than
# detection coverage. Common shapes:
#   - CDN-fronted API gateways behind a WAF with their own TLS / WAF
#   - Cache-heavy traffic where most requests are static-fetch
#   - Bot-management offloaded to upstream
#
# === Empirical numbers (run-profile-sweep-20260502, B-heavy-load) ===
# Median latency:   1.60 ms  (vs 1.89 ms balanced)
# p95 latency:      2.29 ms  (vs 2.90 ms balanced)
# p99 latency:      8.18 ms  (vs 4.52 ms balanced) — heavier load
# Legit OK rate:    97 %     (vs 99 % balanced — slightly more bouncing)
# Detection rate:   80 %     (same; recon/brute-force off)
# Throughput:       417 RPS  (+21 % over balanced under same VU count)
#
# === Tradeoffs vs prod-balanced ===
# - `recon` detector OFF: noisy on legit `/sitemap.xml`,
#   `/robots.txt`, `/.well-known/*` traffic; saves ~5 % CPU.
# - `brute_force` detector OFF: state-keeping per-IP costs
#   memory + tiny CPU. Disable if upstream handles auth shaping.
# - Tighter `risk.thresholds.challenge_at`: 60 (was 40) → fewer
#   suspicious requests get challenges; reserves CPU for the
#   data path.
# - Larger `rate_limit` bucket: 30k/min vs 6k/min — designed for
#   a single instance fronting a CDN cache hit-rate.
# - `load_mode` `critical_rps: 8000` so a sustained 4-8 k RPS
#   stays in Normal mode (no audit-field stripping).
#
# === Required edits before booting ===
# Same as prod-balanced — see § "Required edits" there.

# -----------------------------------------------------------------------------
# CONFIG LAYOUT  (H2a -- see config/README.md "Bootstrap vs Dynamic")
#   BOOTSTRAP  -- file/env only, edit + RESTART to change:
#     listeners, state, node, cluster, config_plane, runtime, admin,
#     interop, geoip, proxy, load_shedder, load_mode, logging
#   DYNAMIC    -- live-editable via API/dashboard; the doc is the source of
#                 truth and this file only SEEDS + publishes it:
#     routes, upstreams, tls, zero_trust, rules, rate_limit, risk, detectors,
#     bots, dlp, response_filter, observability, audit, compliance, tiers,
#     alerting, ai, ddos, fail_mode_by_tier, streaming, graphql
#   NB: state.backend (Redis) is ALWAYS required for the data plane.
# -----------------------------------------------------------------------------

listeners:
  data:
    - bind: "0.0.0.0:8443"
      tls: true
    - bind: "0.0.0.0:8080"
      tls: false
  admin:
    bind: "127.0.0.1:9443"

# Runtime sizing (restart-only). Throughput-tuned: one worker per core.
# cpu_affinity OFF by default — it HURT a containerised box (cgroup-limited
# CPUs → oversubscription). Enable ONLY on dedicated bare-metal/VM with
# real cores + `--features affinity`.
runtime:
  workers: auto
  cpu_affinity: false

tls:
  min_version: "1.2"
  certificates:
    - cert_path: "config/certs/dev.crt"      # REPLACE
      key_ref:   "config/certs/dev.key"      # REPLACE
      hosts:     ["api.example.com"]
  hsts:
    max_age: 31536000
    include_subdomains: true
    preload: false

routes:
  - id: catch-all
    path: "/"
    match_type: prefix
    upstream: app-pool

upstreams:
  app-pool:
    members:
      - addr: "127.0.0.1:9999"   # REPLACE
    lb: round_robin

state:
  backend: redis
  redis:
    urls: ["redis://127.0.0.1:6379"]  # REPLACE
    pool_size: 32
    timeout: "100ms"

risk:
  weights:
    bad_asn: 15
    bad_ja4: 10
    failed_auth: 20
    detector_hit: 25
    bot_unknown: 10
    repeat_offender: 15
  decay_half_life: "5m"
  thresholds:
    challenge_at: 60   # higher than balanced (40)
    block_at:     80
  strikes:
    block_at: 50

# Higher load-mode ceilings so the WAF stays in Normal mode under
# the higher target RPS.
load_mode:
  elevated_rps:    4000
  critical_rps:    8000
  sample_interval: 1s

audit:
  sinks:
    - jsonl:
        path: "/var/log/aegis/audit.jsonl"
  chain:
    enabled: true
  retention: "3d"          # shorter than balanced (7d) — high-volume
  pseudonymize_ip: false

# Bigger bucket for high-RPS deployments behind a CDN / LB.
rate_limit:
  buckets:
    - id: global-ip
      scope: global
      key: ip
      algo: sliding_window
      limit: 30000
      window: "1m"

# ---------------------------------------------------------------------------
# DDoS — per-IP burst gate. Looser than prod-balanced because CDN edges
# fan many real users behind a single source IP to the WAF, so tight
# per-IP caps would bounce legitimate traffic:
#   - per_ip_limit:        5000 (vs 1000 balanced)  → ~500 req/s/IP allowed
#   - block_ttl_s:         180  (vs 300  balanced)  → shorter quarantine
#   - spike_multiplier:    4.0  (vs 3.0  balanced)  → tolerates burstier baseline
#   - tightened_per_ip_rps: 100 (vs 20   balanced)  → softer spike clamp
# If your CDN doesn't restore the original client IP via XFF, even these
# caps will misfire — verify XFF resolution before relying on this gate.
# Full operator guide: docs/security/ddos-protection.md.
# ---------------------------------------------------------------------------
ddos:
  enabled: true
  observe_only: false
  per_ip_limit: 5000
  per_ip_window_s: 10
  block_ttl_s: 180
  spike_multiplier: 4.0
  tightened_per_ip_rps: 100

# Adaptive load shedder (Gradient2). Tier-aware availability gate, NOT a
# detector: sheds with 503 when in-flight concurrency exceeds the adaptive
# limit (Critical never shed; Low → Medium → High shed in that order). The
# limit auto-tunes from WAF-inspection RTT only — upstream latency excluded
# (see crates/aegis-proxy/src/shed.rs). 2026-05-22 — this is the
# throughput-tuned profile, so the ceiling is doubled vs balanced/strict
# (40k) to comfortably clear >=10k RPS with sub-ms inspection; 4k floor.
load_shedder:
  enabled: true
  initial_limit: 40000
  min_limit: 4000

rules:
  paths: []
  max_rule_count: 10000
  strict_compile: false

# Per-tier block scores (per-request gate). 2026-05-23 — 10-apart
# ladder; omit a tier to use the code default. Dashboard PUT
# /api/tiers/<name> applies live overrides (restart re-applies this).
# critical=50 / high=60 / medium=70 / low=80.
# 2026-05-25 — cumulative-IP-risk challenge rung ON per tier: a score in
# the challenge band (risk.thresholds challenge_at..block_at) issues a 429
# PoW instead of passing through. Activates this profile's challenge_at
# tuning (raised to 60 to keep challenges rare), which was inert while
# challenges defaulted off.
tiers:
  critical: { risk_threshold: 50, challenges_enabled: true }
  high:     { risk_threshold: 60, challenges_enabled: true }
  medium:   { risk_threshold: 70, challenges_enabled: true }
  low:      { risk_threshold: 80, challenges_enabled: true }

# Tighter detector mask: recon + brute_force OFF (their hit rates
# are domain-specific; turn them back on if your upstream needs
# the protection).
detectors:
  sqli:             { enabled: true }
  xss:              { enabled: true }
  path_traversal:   { enabled: true }
  ssrf:             { enabled: true }
  header_injection: { enabled: true }
  body_abuse:       { enabled: true }
  recon:            { enabled: false }   # CDN traffic trips this
  brute_force:      { enabled: false }   # auth shaping at upstream

observability:
  prometheus:
    bind: "127.0.0.1:9090"
    enabled: true

admin:
  bind: "127.0.0.1:9443"
  identity:
    user: admin
    password_hash: "REPLACE WITH HASH FROM 'waf admin set-password'"

interop:
  enabled: true
  audit_path: "/var/log/aegis/contract-audit.jsonl"
  control_secret: "REPLACE FROM SECRET MANAGER"
