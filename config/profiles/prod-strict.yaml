# Aegis-Gate — Profile: prod-strict
#
# === When to use ===
# Compliance-heavy deployments. Healthcare (HIPAA), payments (PCI),
# financial services (SOC2 + GDPR + PCI), public-sector. Tradeoff
# is "hold the line first, performance second."
#
# === Empirical numbers (extrapolated from sweep — full run gated on
# operator's compliance-mode configuration) ===
# Median latency:   ~2.5 ms (some compliance pinning adds detector cost)
# p95 latency:      ~4 ms
# p99 latency:      ~10 ms
# Legit OK rate:    ~95 % (tighter thresholds catch more)
# Detection rate:   ~85 % (every detector on + tighter score)
# Throughput:       ~250 RPS at 10 / 10 VUs
#
# === Tradeoffs vs prod-balanced ===
# - `risk.thresholds.challenge_at` 30 (was 40) — earlier intervention
# - `risk.thresholds.block_at`     60 (was 80) — earlier hard-block
# - `risk.strikes.block_at`        25 (was 50) — quicker permanent block
# - `compliance.modes` populated   → SQL/XSS/Path/SSRF detectors LOCKED
#                                    (cannot be disabled via dashboard
#                                    PUT /api/detectors); audit chain
#                                    captures every mode toggle
# - `audit.retention: 90d` (was 7d) — meets common compliance bars
# - `audit.pseudonymize_ip: true`   — GDPR-friendly storage
# - Tighter rate limit (3 k/min vs 6 k) — auth/PII endpoint protection
# - `detectors` fully enabled including `recon` (compliance scanners
#   want every signal; noise is operator's problem)
#
# === Required edits before booting ===
# Same as prod-balanced + populate `compliance.modes` per your
# regulatory profile. The empty default applies no clamps; adding
# any mode locks the detector mask classes that mode pins.

# -----------------------------------------------------------------------------
# CONFIG LAYOUT  (H2a -- see config/README.md "Bootstrap vs Dynamic")
#   BOOTSTRAP  -- file/env only, edit + RESTART to change:
#     listeners, state, node, cluster, config_plane, runtime, admin,
#     interop, geoip, proxy, load_shedder, load_mode, logging
#   DYNAMIC    -- live-editable via API/dashboard; the doc is the source of
#                 truth and this file only SEEDS + publishes it:
#     routes, upstreams, tls, zero_trust, rules, rate_limit, risk, detectors,
#     bots, dlp, response_filter, observability, audit, compliance, tiers,
#     alerting, ai, ddos, fail_mode_by_tier, streaming, graphql
#   NB: state.backend (Redis) is ALWAYS required for the data plane.
# -----------------------------------------------------------------------------

listeners:
  data:
    - bind: "0.0.0.0:8443"
      tls: true
  admin:
    bind: "127.0.0.1:9443"

# Runtime sizing (restart-only). cpu_affinity OFF by default — it HURT a
# containerised box (cgroup-limited CPUs → oversubscription). Enable ONLY
# on dedicated bare-metal/VM with real cores + `--features affinity`.
runtime:
  workers: auto
  cpu_affinity: false

tls:
  min_version: "1.2"   # bump to "1.3" for SOC2 Type II / FedRAMP
  certificates:
    - cert_path: "/etc/aegis/certs/api.example.com.pem"   # REPLACE
      key_ref:   "/etc/aegis/certs/api.example.com.key"   # REPLACE
      hosts:     ["api.example.com"]
  hsts:
    max_age: 63072000          # 2 years (max preload-list eligible)
    include_subdomains: true
    preload: true              # only after submitting to hstspreload.org

# Zero Trust — unified mutual-TLS surface (renamed from tls.client_auth).
# `downstream` = WAF-as-server client-cert verification.
zero_trust:
  downstream:
    mode: required             # mTLS REQUIRED for compliance use cases
    ca_bundle: "/etc/aegis/ca/clients.pem"
    apply_to: [admin]
    allowed_sans: []           # operators add their org SANs

routes:
  - id: catch-all
    path: "/"
    match_type: prefix
    upstream: app-pool

upstreams:
  app-pool:
    members:
      - addr: "127.0.0.1:9999"   # REPLACE
    lb: round_robin

state:
  backend: redis
  redis:
    urls: ["${secret:redis_url}"]   # secret-manager resolved
    pool_size: 32
    timeout: "100ms"

# Tighter risk thresholds — challenge at 30, block at 60, permanent
# strike-block at 25 strikes.
risk:
  weights:
    bad_asn: 15
    bad_ja4: 10
    failed_auth: 25      # bumped (was 20)
    detector_hit: 30     # bumped (was 25)
    bot_unknown: 15      # bumped (was 10)
    repeat_offender: 20  # bumped (was 15)
  decay_half_life: "10m"
  thresholds:
    challenge_at: 30
    block_at:     60
  strikes:
    block_at: 25

load_mode:
  elevated_rps:    1000
  critical_rps:    3000
  sample_interval: 1s

# 90-day retention + pseudonymize IPs at storage time.
audit:
  sinks:
    - jsonl:
        path: "/var/log/aegis/audit.jsonl"
  chain:
    enabled: true
  retention: "90d"
  pseudonymize_ip: true

rate_limit:
  buckets:
    - id: global-ip
      scope: global
      key: ip
      algo: sliding_window
      limit: 3000          # tighter than balanced (6k)
      window: "1m"

# ---------------------------------------------------------------------------
# DDoS — per-IP burst gate. Tighter than prod-balanced across every knob
# to match the rest of this profile's "hold the line first" posture:
#   - per_ip_limit:        200 (vs 1000 balanced)  → ~20 req/s sustained
#   - block_ttl_s:         600 (vs 300 balanced)   → 10-min quarantine
#   - spike_multiplier:    2.0 (vs 3.0 balanced)   → earlier spike trigger
#   - tightened_per_ip_rps: 10 (vs 20  balanced)   → harder spike clamp
# Full operator guide: docs/security/ddos-protection.md.
# ---------------------------------------------------------------------------
ddos:
  enabled: true
  observe_only: false
  per_ip_limit: 200
  per_ip_window_s: 10
  block_ttl_s: 600
  spike_multiplier: 2.0
  tightened_per_ip_rps: 10

# Adaptive load shedder (Gradient2). Tier-aware availability gate, NOT a
# detector: sheds with 503 when in-flight concurrency exceeds the adaptive
# limit (Critical never shed; Low → Medium → High shed in that order). The
# limit auto-tunes from WAF-inspection RTT only — upstream latency excluded
# (see crates/aegis-proxy/src/shed.rs). 2026-05-22 — sized for >=10k RPS:
# 20k ceiling, 2k floor so a transient RTT blip can't shed healthy load.
load_shedder:
  enabled: true
  initial_limit: 20000
  min_limit: 2000

rules:
  paths: []
  max_rule_count: 10000
  strict_compile: true

# Per-tier block scores (per-request gate). 2026-05-23 — 10-apart
# ladder; omit a tier to use the code default. Dashboard PUT
# /api/tiers/<name> applies live overrides (restart re-applies this).
# critical=50 / high=60 / medium=70 / low=80.
# 2026-05-25 — cumulative-IP-risk challenge rung ON per tier: a score in
# the challenge band (risk.thresholds challenge_at..block_at) issues a 429
# PoW instead of passing through. Activates this profile's challenge_at
# tuning, which was inert while challenges defaulted off.
tiers:
  critical: { risk_threshold: 50, challenges_enabled: true }
  high:     { risk_threshold: 60, challenges_enabled: true }
  medium:   { risk_threshold: 70, challenges_enabled: true }
  low:      { risk_threshold: 80, challenges_enabled: true }

# Every detector on. Compliance auditors want every signal even
# if the operator filters/mutes specific ones.
detectors:
  sqli:             { enabled: true }
  xss:              { enabled: true }
  path_traversal:   { enabled: true }
  ssrf:             { enabled: true }
  header_injection: { enabled: true }
  body_abuse:       { enabled: true }
  recon:            { enabled: true }
  brute_force:      { enabled: true }

# Compliance modes — populate these per your regulatory profile.
# Empty default = no clamp; any mode locks the SQL/XSS/Path/SSRF
# classes from being disabled at runtime.
compliance:
  modes: []      # e.g. ["pci_dss"], ["hipaa", "gdpr"], ["soc2", "fips"]

observability:
  prometheus:
    bind: "127.0.0.1:9090"
    enabled: true
  otel:
    # SigNoz collector OTLP gRPC endpoint (deploy/signoz/). Takes effect
    # only when the binary is built with `--features otel`.
    endpoint: "${secret:otel_endpoint}"
    sample_ratio: 0.1   # 10% trace sampling in strict/prod
    # NB: service.name is set by the exporter to "aegis-gate"; OtelConfig
    # has no `service_name` field (an unknown key would be silently ignored).

admin:
  bind: "127.0.0.1:9443"
  identity:
    user: admin
    password_hash: "${secret:admin_password_hash}"

interop:
  enabled: true
  audit_path: "/var/log/aegis/contract-audit.jsonl"
  control_secret: "${secret:waf_control_secret}"
