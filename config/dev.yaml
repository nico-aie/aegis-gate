# Aegis-Gate — Development / Test-harness Configuration
#
# Self-contained config used by `tests/` and `make run-dev`:
#   - no `${secret:env:…}` references — every credential is inline
#     so `cargo run -p aegis-bin -- run --config config/dev.yaml`
#     works without bootstrapping anything else
#   - `state.backend: redis` — same as production. Spin up the dev
#     Redis with `make redis-up` (or `make run-dev` triggers it).
#   - tuned thresholds for single-host k6 / curl smoke runs
#   - `compliance: null` so detector-flip tests aren't clamped
#   - one literal admin: user "admin", password "aegis-test-1234"
#
# Detector mask + risk thresholds + load-mode shape mirror
# `config/profiles/prod-balanced.yaml` so the dev experience matches
# the recommended production profile. The differences (in-memory state,
# inline credentials, loose rate limits, /tmp audit sink) exist solely
# to keep the test harness self-contained.
#
# DO NOT use this config in production:
#   - the password is in version control
#   - the CSRF secret is a literal placeholder
#   - rate limits + risk thresholds are loose to keep tests green
#
# For a real deployment, fork one of:
#   - config/profiles/prod-balanced.yaml      (default — 99 % of cases)
#   - config/profiles/prod-strict.yaml        (compliance-driven)
#   - config/profiles/prod-high-throughput.yaml (CDN front-door)
# See docs/operator/profiles.md for the picker.
#
# To regenerate the password hash (e.g. rotate the test password):
#   echo "<new-password>" | cargo run -p aegis-bin -- admin set-password

listeners:
  data:
    - bind: "0.0.0.0:8080"
      tls: false
    - bind: "0.0.0.0:8443"
      tls: true
  admin:
    # 2026-05-09 obs-stack fix — bound on 0.0.0.0 so the
    # `make obs-up` Prometheus container can scrape `/metrics`
    # via `host.docker.internal:9443`. Loopback bind blocked
    # the container from reaching the WAF, leaving Grafana
    # dashboards empty. **Dev-only** — production profiles
    # (`config/profiles/prod-*.yaml`) bind to specific internal
    # addresses; never expose the admin listener on a public
    # interface.
    #
    # 2026-05-19 committee bind contract: even though this listener
    # is on 0.0.0.0, `/__waf_control/*` is peer-IP-gated to
    # loopback at both mounts (admin_dispatch.rs + accept.rs
    # data-plane short-circuit). The control surface is invisible
    # to any non-loopback caller regardless of bind. Benchmarker
    # reaches it via SSH tunnel from loopback.
    bind: "0.0.0.0:9443"
  # P4 — optional plain-HTTP redirect listener; off by default in
  # dev so the data plane stays on :8080 without conflicts.
  # force_https: { bind: "0.0.0.0:80", status: 301 }

# ---------------------------------------------------------------------------
# TLS — uses the self-signed dev cert generated by `make cert`.
# Self-signed; clients need `curl -k` (or equivalent). Replace with
# real CA-issued certs in production (or use `tls.acme:`).
# ---------------------------------------------------------------------------
tls:
  min_version: "1.2"
  certificates:
    - cert_path: "config/certs/dev.crt"
      key_ref:   "config/certs/dev.key"
      hosts:     ["localhost", "127.0.0.1", "aegis-gate.local"]

# ---------------------------------------------------------------------------
# Routes — single catch-all so every test request reaches the data plane
# ---------------------------------------------------------------------------
routes:
  - id: catch-all
    path: "/"
    match_type: prefix
    upstream: stub-pool
    # 2026-05-25 — default routing tier = high. The catch-all is the
    # fallback for every unmatched request, so this makes HIGH the
    # effective default tier (per-request block threshold 60 instead of
    # Low's 80). Without this the route falls back to the code default
    # (Tier::Low). Raise/lower per specific route with its own tier_override.
    tier_override: high

# ---------------------------------------------------------------------------
# Upstream pools — single stub. Tests don't reach the upstream;
# the proxy returns "OK" inline when a request makes it past the
# security pipeline.
# ---------------------------------------------------------------------------
upstreams:
  stub-pool:
    members:
      - addr: "127.0.0.1:9999"
    lb: round_robin

# ---------------------------------------------------------------------------
# State backend — Redis. Same shape as production so behaviour is
# identical between dev and prod. The dev Redis lives in the docker
# compose at deploy/docker-compose.dev.yml; spin it up with
# `make redis-up`. Tests that need self-contained synthetic load
# (no Redis hop) live under tests/hackathon/configs/* and override
# this block to `in_memory` explicitly — that's stress-test infra,
# not deployment.
# ---------------------------------------------------------------------------
state:
  backend: redis
  redis:
    urls: ["redis://127.0.0.1:6379"]
    pool_size: 16
    timeout: "100ms"

# ---------------------------------------------------------------------------
# Per-tier block scores (per-request gate). A request blocks when its
# summed detector score reaches the matched tier's risk_threshold.
# 2026-05-23 — clean 10-apart ladder. Omit a tier to use the code
# default (Tier::defaults_for). Dashboard PUT /api/tiers/<name> applies
# live runtime overrides; a restart re-applies this block.
#   critical=50  blocks score>=50 (recon-tool/open-redirect/AI/… + up)
#   high=60      blocks score>=60 (AI / mass_assignment / velocity + up)
#   medium=70    blocks score>=70 (clear exploits: sqli/xss/… + up)
#   low=80       blocks score>=80 (definitive-RCE Log4Shell/XXE + canary)
# ---------------------------------------------------------------------------
# 2026-05-25 — challenges_enabled: true on every tier. With it on, a
# cumulative IP-risk score in the challenge band (risk.thresholds
# challenge_at..block_at) issues a 429 PoW challenge instead of passing
# through as allow. Off (the code default) only block_at blocks.
tiers:
  critical: { risk_threshold: 50, challenges_enabled: true }
  high:     { risk_threshold: 60, challenges_enabled: true }
  medium:   { risk_threshold: 70, challenges_enabled: true }
  low:      { risk_threshold: 80, challenges_enabled: true }

# ---------------------------------------------------------------------------
# Detectors — every class on, so attack-corpus tests trip them all
# ---------------------------------------------------------------------------
detectors:
  sqli:             { enabled: true }
  xss:              { enabled: true }
  path_traversal:   { enabled: true }
  ssrf:             { enabled: true }
  header_injection: { enabled: true }
  body_abuse:       { enabled: true }
  recon:            { enabled: true }
  # Disabled in dev because the harness funnels every legit /login
  # through 127.0.0.1; collectively they cross the 10/60s threshold
  # within seconds. Production keeps it ON (real IPs fan out).
  brute_force:      { enabled: false }

# ---------------------------------------------------------------------------
# AI detector — operator-supplied ONNX classifier. Treated like any other
# detector class once on: a non-Normal verdict above `confidence_threshold`
# emits a Signal that contributes to the request's risk score (same path
# as sqli / xss / etc). To enable:
#
#   1. Build with the feature:  FEATURES="redis geoip alerts ai" make build
#      (the default Makefile target now includes `ai`)
#   2. Symlink your model:      make ai-link MODEL=/abs/path/to/waf_model.onnx
#   3. Flip the toggle below:   enabled: true
#
# Hot-flippable at runtime via the Detectors page (audit-mutated PUT
# /api/ai/enabled). Tighten `confidence_threshold` (0.7 / 0.85 / 0.95)
# before promoting the detector to a route's blocking budget.
# ---------------------------------------------------------------------------
ai:
  # 2026-05-08 — disabled by default. The current ONNX model
  # over-fires on benign traffic at every threshold below 0.95
  # (QA Run-2 measured ~75% FP at 0.85 against clean traffic
  # paths like /api/list, /favicon.ico, /static/app.js). This
  # depresses the data_plane_availability SLO to ~40% in dev,
  # which masks real failures.
  #
  # Two paths to enable:
  #
  #   A. Runtime opt-in via the v2.3 control plane (no restart):
  #      curl -X POST http://127.0.0.1:8080/__waf_control/set_profile \
  #        -H "X-Benchmark-Secret: <secret>" \
  #        -H "content-type: application/json" \
  #        -d '{"scope":"policies","feature":"rules_engine",
  #             "policies":["ai"],"mode":"log_only"}'
  #      → AI signals appear in audit but never enforce.
  #
  #   B. Per-deployment calibration (recommended for prod):
  #      1. Sample clean traffic from your real upstream for ≥ 1 h.
  #      2. Run the model offline against the sample; pick the
  #         threshold that yields < 5% FP rate.
  #      3. Set `enabled: true` + `confidence_threshold: <picked>`
  #         here (or in your prod profile).
  #
  # Threshold note: 0.85 is the calibrated default in config.rs
  # (default_ai_confidence_threshold). Don't ship `enabled: true`
  # at any threshold below 0.95 without running step B.
  enabled: false
  model_path: data/ai_model/waf_model.onnx
  confidence_threshold: 0.85

  # 2026-05-23 — synchronous session pool. `sessions: N` loads N
  # independent ONNX sessions; each request grabs a free one and runs
  # [1,27] directly (no batching, no async bridge). ~N× the single-
  # session throughput with the same low-tail synchronous latency — the
  # scaling lever for a fast model when one session can't keep up with
  # the AI-invocation rate. Each pooled session is capped to 1 intra-op
  # thread (parallelism from the pool, not per-session threads). Default 1.
  #   sessions: 4

  # In-process dynamic batching (Triton-style): requests within `delay_ms`
  # share one [N,27] ONNX pass across `workers` sessions. Only a win when
  # inference itself is the bottleneck (slow/large model or GPU); for a
  # fast CPU model prefer the session pool above — batching's coordination
  # overhead can hurt p99 at high request rates. Fail-open + sheds under
  # overload. Ignored when `sessions` alone is set without batch_enabled.
  #   batch_enabled: false   # set true to enable batch mode
  #   workers: 4             # parallel ONNX sessions (default: CPU count, max 8)
  #   max_batch: 32          # max requests per forward pass (default 32)
  #   delay_ms: 2            # batch fill window in ms (default 2)

# ---------------------------------------------------------------------------
# Bot classifier (gate-style, observational) — DEFAULT OFF
# ---------------------------------------------------------------------------
# Labels each request human / verified / suspect / malicious from UA + ASN
# signals and feeds Investigation → "Bot classification mix" + the audit
# `bot_category`. OBSERVATIONAL only today (no per-class block/challenge).
# Needs the GeoIP ASN DB (geoip.asn_db) to classify cloud/hosting traffic;
# scanner-UA + short-UA classification works without it. Opt in here or via
# Traffic Gates → "6. Bot classifier" (audit-mutated PUT /api/gates/bots).
# Omitting this block entirely is equivalent to `enabled: false`.
bots:
  enabled: false

# ---------------------------------------------------------------------------
# Risk scoring — tuned for the P6 k6 scenario (`risk-strikes.js`)
# ---------------------------------------------------------------------------
risk:
  weights:
    bad_asn: 15
    bad_ja4: 10
    failed_auth: 20
    detector_hit: 25
    bot_unknown: 10
    repeat_offender: 15
  decay_half_life: "5m"
  thresholds:
    # 2026-05-22 — cumulative IP-risk gate ENABLED by default (enforce).
    # Operators have `log_only` as a safety valve (set_profile / dashboard
    # Shadow Mode), so the traffic gates ship on. CAVEAT for load tests:
    # dev traffic often comes from ONE source IP (many k6 VUs), and a
    # per-IP cumulative gate lets attacker VUs raise the score for legit
    # VUs sharing that IP → spurious 429/403. When benchmarking, flip to
    # `log_only` (or vary source IPs). Per-request detector blocks fire
    # independently of this gate.
    enabled:      true
    challenge_at: 40
    block_at:     80
    max:          100
  trust_recovery:
    per_hour: 30
  strikes:
    # Strike-based block threshold also disabled in dev (same
    # shared-IP rationale). Production keeps 50 (see
    # config/profiles/prod-balanced.yaml). Detector hits are
    # still recorded, but the strike counter never trips.
    block_at: 1000000   # disabled — strike block not used in dev

# ---------------------------------------------------------------------------
# Load mode — thresholds tuned so a laptop k6 runner can drive the
# WAF past `critical_rps` within 8 s. `loadmode-degradation.js`
# stages B + C assert these exact values (500 / 2 000).
# ---------------------------------------------------------------------------
load_mode:
  elevated_rps:    500
  critical_rps:    2000
  sample_interval: 1s
  hysteresis:      0.10

# ---------------------------------------------------------------------------
# Logging — start at "info" so every audit event lands; the P8
# k6 scenario flips this to "silent" and back.
# ---------------------------------------------------------------------------
logging:
  verbosity: info

# ---------------------------------------------------------------------------
# Audit — OPERATOR sink (dashboard / SIEM / cold-tier shipper)
#
# Schema: AuditEvent (rich) — `client_ip` (XFF-resolved), `ts` (ISO 8601),
# `class`, `tenant_id`, `tier`, `fields.{...}` nested. This is the SOC
# / forensics audit; it carries decoded request fields and detector
# mask state, NOT a stable contract schema.
#
# The CONTRACT audit (v2.3 §6: request_id, ts_ms, ip, method, path,
# action, risk_score, mode) lives at a SEPARATE sink configured under
# `interop.audit_path` (default ./waf_audit.log). Both sinks run in
# parallel. The OC harness parses the contract sink; humans read this
# one. See deploy/STAGING-BENCHMARK.md §"Audit log files".
# ---------------------------------------------------------------------------
audit:
  sinks:
    - jsonl:
        path: "/tmp/aegis-dev-audit.jsonl"
  chain:
    enabled: true
  retention: "7d"
  pseudonymize_ip: false

# ---------------------------------------------------------------------------
# Rate limit — loose enough that smoke tests don't trip it
# ---------------------------------------------------------------------------
rate_limit:
  buckets:
    - id: global-ip
      scope: global
      key: ip
      algo: sliding_window
      # 2026-05-20 — loose per-IP volumetric backstop (1M / 60s).
      # The benchmarker drives high RPS from a small set of source
      # IPs; a tight per-IP cap would throttle legit benchmark
      # traffic. Tighten only if defending a real deployment.
      limit: 1000000
      window: "1m"

# ---------------------------------------------------------------------------
# DDoS — per-IP burst gate. Peer of rate_limit / strike-block / access-list.
# Sliding-window auto-block: an IP that sustains > per_ip_limit requests in
# per_ip_window_s seconds is auto-blocked for block_ttl_s. EWMA spike-mode
# ticker is per-process (cluster-broadcast deferred behind ha-clustering).
# Full operator guide: docs/security/ddos-protection.md.
#
# Note: these values are the framework defaults, written explicitly here
# for discoverability — the gate ships ON by default even if this block
# is absent. Same shape as `config/profiles/prod-balanced.yaml`.
# ---------------------------------------------------------------------------
ddos:
  enabled: true              # gate on (secure-by-default)
  observe_only: false        # enforce; flip to true for shadow-mode validation
  per_ip_limit: 60000        # 2026-05-22 — raised 1000 → 60000 (6k rps/IP) per operator policy
  per_ip_window_s: 10        # sliding-window length (seconds)
  block_ttl_s: 300           # auto-block duration on burst-exceed (5 min)
  spike_multiplier: 3.0      # current_rps > 3 × baseline → spike_active
  tightened_per_ip_rps: 20   # per-IP cap during spike (cluster-wire deferred)

# ---------------------------------------------------------------------------
# Adaptive load shedder (Gradient2). Tier-aware availability gate, NOT a
# detector: when in-flight concurrency exceeds the adaptive limit it sheds
# with 503 (Critical never shed; Low → Medium → High shed in that order).
# The limit auto-tunes from WAF-inspection RTT only (upstream latency is
# excluded — see crates/aegis-proxy/src/shed.rs).
# 2026-05-22 — sized for >=10k RPS. By Little's law concurrency ≈ RPS ×
# WAF-latency; with sub-ms inspection a 20k ceiling leaves ample headroom,
# and the 2k floor stops a transient RTT blip from shedding healthy load.
# ---------------------------------------------------------------------------
load_shedder:
  enabled: true
  initial_limit: 20000       # adaptive ceiling (max concurrent in WAF)
  min_limit: 2000            # floor — never shed below this concurrency

# ---------------------------------------------------------------------------
# Rules — the detectors carry the load; no custom rules in dev
# ---------------------------------------------------------------------------
rules:
  paths: []
  max_rule_count: 10000
  strict_compile: false

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
observability:
  prometheus:
    path: "/metrics"
  access_log:
    format: json
    sink: stdout

# ---------------------------------------------------------------------------
# GeoIP — MaxMind .mmdb readers. Both fields optional; this block is a
# no-op when neither path resolves AND when the binary isn't built with
# the `geoip` Cargo feature. Operators populate `data/geoip/` locally
# via `make geoip-link` (see data/geoip/README.md). Build with
# `--features geoip` (or `--features production`) to activate the reader.
# ---------------------------------------------------------------------------
geoip:
  country_db: "data/geoip/GeoLite2-Country.mmdb"
  asn_db: "data/geoip/GeoLite2-ASN.mmdb"

# ---------------------------------------------------------------------------
# Admin — inline literal credentials (test harness only)
# user:     admin
# password: aegis-test-1234
# csrf:     test-csrf-secret-do-not-use-in-production-32b
# ---------------------------------------------------------------------------
admin:
  # 2026-05-09 obs-stack fix — bound on 0.0.0.0 so the
  # `make obs-up` Prometheus container can scrape `/metrics`
  # at `host.docker.internal:9443`. Loopback bind blocked
  # the container from reaching the WAF, leaving Grafana
  # dashboards empty. Dev-only — production profiles bind
  # to specific internal addresses.
  bind: "0.0.0.0:9443"
  # FIX 2026-05-03 — admin TLS is now wired (was always plain
  # HTTP regardless of cert config before this commit). Default
  # for `make run-dev` is unset → plain HTTP (matches the
  # AEGIS_INSECURE_COOKIES=1 flag the run target sets, since
  # browsers reject `Secure` cookies on http://). To boot dev
  # with admin HTTPS instead:
  #
  #   1. Comment out AEGIS_INSECURE_COOKIES=1 in Makefile's
  #      run-dev target (or use `make run` which doesn't set it).
  #   2. Uncomment the `tls:` block below.
  #   3. Trust the self-signed dev cert in your browser
  #      (already at config/certs/dev.crt; `make cert` regens
  #      it).
  #   4. Open https://localhost:9443/dashboard.
  #
  # tls:
  #   min_version: "1.2"
  #   certificates:
  #     - cert_path: "config/certs/dev.crt"
  #       key_ref:   "config/certs/dev.key"
  #       hosts:     ["localhost", "127.0.0.1"]
  dashboard_auth:
    password_hash_ref: '$argon2id$v=19$m=19456,t=2,p=1$DfRgVNq6Cb+eN3BEMmExAQ$69SVZBNpMFjN4evfN8g+U5jnmP56Gwx3AGaZFr32ZzY'
    csrf_secret_ref:   "test-csrf-secret-do-not-use-in-production-32b"
    session_ttl_idle: "30m"
    session_ttl_absolute: "8h"
    ip_allowlist:
      - "127.0.0.1/32"
      - "::1/128"
    totp_enabled: false
    login_rate_limit:
      per_ip:
        limit: 100              # loose so the API smoke can run repeatedly
        window: "1m"
      per_user:
        limit: 200
        window: "15m"
    lockout:
      threshold: 50
      window: "15m"
      duration: "5m"

# ---------------------------------------------------------------------------
# Compliance — explicitly omitted so detector toggle tests aren't
# clamped by PCI/HIPAA/SOC2 invariants. Set this in any production
# config; see docs/compliance.md.
# ---------------------------------------------------------------------------
# compliance: null
