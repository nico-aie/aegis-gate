# Aegis-Gate — Cluster Node A (HA test fixture)
#
# Pairs with `cluster-b.yaml` to drive the `tests/cluster/`
# scripts. Both nodes share the same Redis backend so they form a
# real two-node cluster on a single host.
#
# Node-distinguishing values:
#   - data plane on :8080  (cluster-b uses :8090)
#   - admin plane on :9443 (cluster-b uses :9543)
#   - node id in audit ring derived from hostname + PID at boot
#
# Bring-up:
#   docker run -d --name aegis-cluster-redis \
#     -p 6379:6379 redis:7-alpine \
#     redis-server --save "" --appendonly no
#   target/release/waf run --config config/cluster-a.yaml &
#   target/release/waf run --config config/cluster-b.yaml &
#
# Tear-down:
#   pkill -f 'waf run --config config/cluster-' ; \
#     docker rm -f aegis-cluster-redis

# HA-T3 — stable node identity. Leaderless (2026-06-10): this
# surfaces as `/api/cluster.our_node: "waf-a"` and the node's
# `members:waf-a` heartbeat key; survives restart cleanly.
# -----------------------------------------------------------------------------
# CONFIG LAYOUT  (H2a -- see config/README.md "Bootstrap vs Dynamic")
#   BOOTSTRAP  -- file/env only, edit + RESTART to change:
#     listeners, state, node, cluster, config_plane, runtime, admin,
#     interop, geoip, proxy, load_shedder, load_mode, logging
#   DYNAMIC    -- live-editable via API/dashboard; the doc is the source of
#                 truth and this file only SEEDS + publishes it:
#     routes, upstreams, tls, zero_trust, rules, rate_limit, risk, detectors,
#     bots, dlp, response_filter, observability, audit, compliance, tiers,
#     alerting, ai, ddos, fail_mode_by_tier, streaming, graphql
#   NB: state.backend (Redis) is ALWAYS required for the data plane.
# -----------------------------------------------------------------------------

node:
  id: "waf-a"

listeners:
  data:
    - bind: "0.0.0.0:8080"
      tls: false
  admin:
    bind: "127.0.0.1:9443"

# 2026-05-29 — top-level `admin:` block holds `dashboard_auth` (the
# argon2 password hash + CSRF secret + session TTLs). Without it
# `DashboardAuthConfig::default()` ships with an empty hash and
# every POST /admin/login returns 401 invalid_credentials — which
# blocks tests/n-tester/_common.sh `login()` and silently aborts
# every cluster test.
#
# Hash is for the password `aegis-test-1234` (same as dev.yaml).
# DO NOT use these values in production; they're hardcoded for the
# HA test fixture only.
admin:
  dashboard_auth:
    password_hash_ref: '$argon2id$v=19$m=19456,t=2,p=1$DfRgVNq6Cb+eN3BEMmExAQ$69SVZBNpMFjN4evfN8g+U5jnmP56Gwx3AGaZFr32ZzY'
    csrf_secret_ref:   "test-csrf-secret-do-not-use-in-production-32b"
    session_ttl_idle: "30m"
    session_ttl_absolute: "8h"
    ip_allowlist:
      - "127.0.0.1/32"
      - "::1/128"
    totp_enabled: false
    # TOTP-2 (TF-1) — EXPLICIT dev/CI opt-out from the enforced-by-default
    # 2FA policy. Without this line a password-only login only reaches the
    # TOTP-enrollment surface. Never ship false to production.
    require_totp: false

# 2026-05-30 — AI detector enabled in the cluster fixture so NT-AI
# tests (incl. nt-11 live-effect) exercise the real model, not the
# feature-off path. The dashboard's Detectors → AI row will show
# `feature_present: true` and a green "enabled" pill. Tests that
# need the feature-off path now have to flip cfg.ai.enabled or
# unset model_path explicitly (none of NT-01..12 do).
ai:
  enabled: true
  model_path: "data/ai_model/waf_model.onnx"
  confidence_threshold: 0.85

routes:
  - id: catch-all
    path: "/"
    match_type: prefix
    upstream: stub-pool

upstreams:
  stub-pool:
    members:
      - addr: "127.0.0.1:8081"
    lb: round_robin

# ---------------------------------------------------------------------------
# Redis-backed state — the whole point of this fixture. Both
# cluster nodes round-trip rate-limit counters + block lists through
# the same primary so a request to either node sees the union
# state.
# ---------------------------------------------------------------------------
state:
  backend: redis
  redis:
    urls: ["redis://127.0.0.1:6379"]
    pool_size: 8
    timeout: "1s"
  reconcile:
    readiness_warm_ms: "5s"

# ---------------------------------------------------------------------------
# Leaderless multi-node console sync (cluster plan Phases 2 & 3). Both
# enabled here so the tests/cluster/ rig exercises cross-node event
# fanout (07/08) and the merged fleet-metrics view (09). Gated on the
# Redis backend above — single-node deploys leave these off.
# ---------------------------------------------------------------------------
cluster:
  fleet_events:
    enabled: true
  fleet_view:
    enabled: true
    publish_interval_ms: 1000   # tight cadence so the rig converges fast
    snapshot_ttl_ms: 5000
  # Phase 5 — pub/sub state nudge: set_profile/reset_state converge in ms
  # (the rig's 07-control-plane-sync exercises this). Non-load-bearing.
  pubsub_nudge: true

detectors:
  sqli:             { enabled: true }
  xss:              { enabled: true }
  path_traversal:   { enabled: true }
  ssrf:             { enabled: true }
  header_injection: { enabled: true }
  body_abuse:       { enabled: true }
  recon:            { enabled: true }
  brute_force:      { enabled: true }

risk:
  weights:
    bad_asn: 15
    bad_ja4: 10
    failed_auth: 20
    detector_hit: 25
    bot_unknown: 10
    repeat_offender: 15
  decay_half_life: "5m"
  thresholds:
    challenge_at: 40
    block_at:     80
    max:          100
  trust_recovery:
    per_hour: 30
  strikes:
    block_at: 50

rate_limit:
  buckets:
    - id: global-ip
      scope: global
      key: ip
      algo: sliding_window
      # Set high so HA load tests can measure failover budget
      # without the rate-limit dominating the result. Production
      # operators with real DDoS budgets set this much lower.
      limit: 10000000
      window: "1m"

rules:
  paths: []
  max_rule_count: 10000
  strict_compile: false

observability:
  prometheus:
    path: "/metrics"
  access_log:
    format: json
    sink: stdout
