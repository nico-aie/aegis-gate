# nginx as an L4 (TCP passthrough) load balancer in front of the WAF fleet.
#
# `stream {}` forwards raw TCP — it does NOT terminate TLS or parse HTTP, so the
# WAF stays the edge: it terminates TLS (JA3/JA4 preserved) and every protocol
# (h1/h2/ws/gRPC/raw-tcp) passes through untouched. The one cost: nginx SNATs, so
# each WAF node sees NGINX's IP as the client (not the real one) — there's no
# TPROXY (needs root) / PROXY-protocol (WAF unsupported) / XFF-trust (not plumbed)
# on this host. Fine for testing fan-out + cluster behaviour; for real client IP
# use DNS round-robin (no LB). See deploy/PRE-PROD-DEPLOY.md.

worker_processes 1;   # deterministic round-robin (auto on a many-core host
                      # gives each worker its own RR counter → looks pinned to node1)
events { worker_connections 4096; }

stream {
    log_format lb '$remote_addr -> $upstream_addr status=$status bytes=$bytes_sent';
    access_log /var/log/nginx/stream.log lb;

    # Per-connection round-robin across the WAF nodes. `max_fails`/`fail_timeout`
    # eject a dead node; both share Redis so state/config stay consistent.
    # WAF nodes' TLS data ports — nginx forwards the raw TLS bytes; the WAF
    # terminates TLS and computes JA3/JA4 → device_fp. nginx holds NO cert.
    # (On separate machines each node uses :8443; the :8444 here is only because
    #  both local nodes share one host — see deploy guide.)
    upstream waf_nodes {
        server 10.20.0.72:8443 max_fails=2 fail_timeout=5s;   # waf-infra-1 TLS (local)
        server 10.20.0.40:8443 max_fails=2 fail_timeout=5s;   # waf-3 TLS (remote VM)
        server 10.20.0.21:8443 max_fails=2 fail_timeout=5s;   # waf-2 TLS (remote VM)
    }

    # TLS VIP — passthrough. Client speaks TLS end-to-end with the WAF; nginx
    # never decrypts (no cert here). `curl -k https://<host>:8088/`.
    server {
        listen 8088;
        proxy_pass waf_nodes;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }

    # ── Admin console VIPs — ONE published port per node (NOT a pool) ────────
    # QC forwards each of these host ports from this machine to reach a SPECIFIC
    # node's dashboard, so per-node behaviour is testable in isolation. A round-
    # robin pool would be WRONG here — it bounces the login session / CSRF across
    # nodes. So: one listen port == one node. L4 passthrough → the dashboard's
    # SSE live-fleet feed streams cleanly (no proxy buffering to tune); the long
    # timeout keeps the event-stream alive. Each admin is auth-gated + ip_allowlist;
    # /__waf_control stays loopback-only (peer-gated) so it is NOT reachable here.
    #
    # PREREQ: the target node's admin must bind 0.0.0.0:9443 (NOT 127.0.0.1) so
    # this host can reach it. The infra node already does; remote nodes default to
    # 127.0.0.1:9443 (REMOTE-NODE-KICKOFF §4) → rebind them to 0.0.0.0:9443 first,
    # else :56244/:56245 will connect-refuse. (Leaderless cluster note: every
    # node's console already shows the WHOLE fleet, so for fleet view any one port
    # suffices; these per-node ports are for testing an INDIVIDUAL node directly.)
    #
    #   host :56243 → waf-infra-1 (10.20.0.72)   [this host]
    #   host :56244 → waf-2       (10.20.0.21)
    #   host :56245 → waf-3       (10.20.0.40)
    server { listen 56243; proxy_pass 10.20.0.72:9443; proxy_connect_timeout 5s; proxy_timeout 1h; }
    server { listen 56244; proxy_pass 10.20.0.21:9443; proxy_connect_timeout 5s; proxy_timeout 1h; }
    server { listen 56245; proxy_pass 10.20.0.40:9443; proxy_connect_timeout 5s; proxy_timeout 1h; }
}
