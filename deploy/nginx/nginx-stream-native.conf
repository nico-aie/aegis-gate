# Native (host) nginx LB — run as the unprivileged user, NOT in rootless Docker.
#
# WHY: rootless Docker publishes ports via rootlesskit's `builtin` port driver,
# which SNATs every incoming connection to the bridge gateway (172.26.0.1) BEFORE
# the container sees it. So a containerized LB can NEVER learn the real client IP —
# `proxy_protocol on;` then faithfully forwards 172.26.0.1. Running nginx NATIVELY
# on the host binds the real interface, so it sees the true source IP and the PROXY
# header carries the real client to the WAF. The ports (56208/56243-5) are all
# > 1024, so this needs NO root. The WAF nodes themselves are also native host
# processes — only the LB was containerized.
#
# RUN (see deploy/nginx/native-lb.sh):
#   PFX=/home/nico/aegis-gate/deploy/nginx/native
#   conda run -n nginx-lb nginx -p $PFX -c /home/nico/aegis-gate/deploy/nginx/nginx-stream-native.conf
#
# This file mirrors nginx-stream.conf (the container variant) but: loads the stream
# module dynamically, writes pid/logs/temp under deploy/nginx/native/ (user-writable),
# and listens on the PUBLISHED host ports directly (no docker port mapping).

load_module /home/nico/miniconda3/envs/nginx-lb/lib/nginx/modules/ngx_stream_module.so;

# No `user` directive — running as a normal user; nginx won't try to setuid workers.
worker_processes 1;          # deterministic round-robin (see nginx-stream.conf)
error_log  logs/error.log warn;
pid        run/nginx.pid;
events { worker_connections 4096; }

stream {
    log_format lb '$remote_addr -> $upstream_addr status=$status bytes=$bytes_sent';
    access_log logs/stream.log lb;

    upstream waf_nodes {
        server 10.20.0.72:8443 max_fails=2 fail_timeout=5s;   # waf-infra-1 TLS (local)
        server 10.20.0.40:8443 max_fails=2 fail_timeout=5s;   # waf-3 TLS (remote VM)
        server 10.20.0.21:8443 max_fails=2 fail_timeout=5s;   # waf-2 TLS (remote VM)
    }

    # Data VIP — TLS passthrough + PROXY protocol. Native nginx sees the REAL client
    # IP here (no rootless SNAT), so the header carries the true source to every node.
    # All 3 nodes run `accept_proxy` + trust this host in proxy.trusted_proxies.
    server {
        listen 56208;
        proxy_pass waf_nodes;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }

    # Per-node admin console VIPs (one port == one node; L4 passthrough, long timeout
    # for the dashboard SSE). Admin is plain HTTP. See nginx-stream.conf for rationale.
    server { listen 56243; proxy_pass 10.20.0.72:9443; proxy_connect_timeout 5s; proxy_timeout 1h; }
    server { listen 56244; proxy_pass 10.20.0.21:9443; proxy_connect_timeout 5s; proxy_timeout 1h; }
    server { listen 56245; proxy_pass 10.20.0.40:9443; proxy_connect_timeout 5s; proxy_timeout 1h; }
}
