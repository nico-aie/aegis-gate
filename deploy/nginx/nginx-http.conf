# nginx as an L7 (HTTP) load balancer in front of the WAF fleet — with
# X-Forwarded-For forwarding.
#
# Unlike the L4 `stream` variant (nginx-stream.conf), this PARSES HTTP, so it can
# inject X-Forwarded-For / X-Real-IP with the client address. Cost: nginx
# terminates the HTTP connection (and TLS, when enabled) → the WAF is no longer
# the TLS edge, so JA3/JA4 fingerprinting is lost. Use this when you want the WAF
# to derive the client from XFF (pending the WAF's XFF-resolution + trusting
# nginx's IP in trusted_proxies). See deploy/PRE-PROD-DEPLOY.md.
#
# ⚠️ Today the WAF IGNORES XFF (default trusted_proxies is empty / not plumbed),
# so it still keys on nginx's peer IP. Once XFF resolution lands + nginx's IP is
# trusted, the headers below give it the real client.

# worker_processes 1: on a many-core host, `auto` spawns many workers, each with
# its OWN round-robin counter — low-volume sequential requests scatter across
# fresh workers that all start at server #1, so traffic looks pinned to node1.
# One worker (or an upstream `zone` for shared state) makes round-robin
# deterministic. Fine for a test LB; under real concurrent load `auto` evens out.
worker_processes 1;
events { worker_connections 4096; }

http {
    # `$proxy_add_x_forwarded_for` = inbound XFF (if any) + the client's address,
    # so a client-sent XFF is appended rather than overwritten.
    log_format lb '$remote_addr fwd_for="$proxy_add_x_forwarded_for" -> $upstream_addr status=$status';
    access_log /var/log/nginx/access.log lb;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream waf_nodes {
        server 10.20.0.72:8080 max_fails=2 fail_timeout=5s;   # waf-infra-1
        server 10.20.0.72:8081 max_fails=2 fail_timeout=5s;   # waf-infra-2
    }

    server {
        listen 8088;

        location / {
            proxy_pass http://waf_nodes;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # ← client IP chain
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket / HTTP/1.1 keep-alive upgrade passthrough
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }
}
