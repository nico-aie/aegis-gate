icon: https://example.com/aegis-gate-icon.png
sources:
  - https://github.com/example/aegis-gate
maintainers:
  - name: Aegis-Gate
    url: https://github.com/example/aegis-gate
keywords:
  - waf
  - security
  - reverse-proxy
  - gateway
  - rust
annotations:
  category: Security
