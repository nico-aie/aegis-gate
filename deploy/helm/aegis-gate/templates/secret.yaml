{{/*
Chart-managed Secret. Only rendered when the operator passes the
admin password hash and/or CSRF secret as literal values rather
than referencing an existing Secret. Production deployments
should use the existingSecret path so the values never live in
helm-rendered manifests.
*/}}
{{- if and (or .Values.admin.password.hash .Values.admin.csrf.secret) (or (not .Values.admin.password.existingSecret.name) (not .Values.admin.csrf.existingSecret.name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-gate.fullname" . }}-auth
  labels:
    {{- include "aegis-gate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.admin.password.hash (not .Values.admin.password.existingSecret.name) }}
  password_hash: {{ .Values.admin.password.hash | quote }}
  {{- end }}
  {{- if and .Values.admin.csrf.secret (not .Values.admin.csrf.existingSecret.name) }}
  csrf_secret: {{ .Values.admin.csrf.secret | quote }}
  {{- end }}
{{- end }}
