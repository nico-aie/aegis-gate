# Aegis-Gate cluster Redis — hardened (2026-06-18 hijack mitigation).
# Shared by the fleet over the LAN (waf-2/waf-3 connect remotely), so it CANNOT be
# loopback-only; AUTH (--requirepass, from compose .env) + anti-hijack command renames
# are the application-level mitigation. Lock the port at the network layer too if possible.
protected-mode yes
appendonly yes
save 60 1
# Neutralize the commands an attacker uses to hijack / exfiltrate / persist:
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MODULE ""
rename-command DEBUG ""
rename-command CONFIG ""
