# Hardened Redis config for aegis-gate (2026-06-19, R-2/R-6).
#
# Context: an unauthenticated Redis published on 0.0.0.0:6379 was hijacked via
# `REPLICAOF <attacker> <port>` (2026-06-18 23:25 UTC) — it became a read-only
# replica and its dataset was wiped, which cascaded into a silent admin-plane
# lockout (see plans/issues/PLAN-security-consolidated-2026-06-19.md).
#
# This config is the secure baseline. Mount it into the redis container and
# launch with: redis-server /etc/redis/redis.conf
# In ANY non-loopback deployment you MUST also set a password (see below) and
# bind to a private interface + lock the firewall / security group to :6379.

# --- Network -----------------------------------------------------------------
# protected-mode refuses external connections when no password is set. Keep it
# on. For a single-box dev stack the container also publishes only to
# 127.0.0.1 (see docker-compose.dev.yml).
protected-mode yes

# --- Authentication ----------------------------------------------------------
# REQUIRED for any deployment where Redis is reachable beyond loopback (the
# prod VM cluster). Uncomment and set a strong value, and give the WAF the
# password in its state.redis.urls (redis://:PASSWORD@host:6379). The dev
# compose can also inject it via `--requirepass ${REDIS_PASSWORD}`.
# requirepass CHANGE_ME_TO_A_LONG_RANDOM_SECRET

# --- Disable the commands used to hijack / backdoor an open Redis -------------
# REPLICAOF/SLAVEOF turned us into the attacker's replica; CONFIG SET dir/
# dbfilename is the classic SSH-key / cron RDB-write backdoor; MODULE LOAD is
# the RCE-via-module vector; DEBUG is an abuse aid. The WAF needs none of them.
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command CONFIG ""
rename-command MODULE ""
rename-command DEBUG ""

# --- Persistence / backup (R-6) ----------------------------------------------
# The incident wiped 95 config versions with no recovery (save was disabled).
# Snapshot to disk so a restart/incident has a point-in-time to recover from.
# Pair with an offsite `BGSAVE`+copy cron in production (see runbook).
save 900 1
save 300 10
appendonly no
dir /data
