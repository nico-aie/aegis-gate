# Aegis-Gate — Development Stack
#
# Two planes, one compose file:
#
#   CONTROL PLANE (required)
#     - etcd         source of truth for config + secrets + leases
#     - prometheus   scrapes both planes, alerts on staleness
#     - jaeger       OTLP trace collector — LEGACY. Traces now go to
#                    SigNoz (deploy/signoz/, `make signoz-up`); `make
#                    obs-up` no longer starts jaeger. Kept for anyone
#                    who still wants a lightweight local trace sink:
#                    `docker compose -f deploy/docker-compose.dev.yml up -d jaeger`
#
#   DATA PLANE (optional add-ons)
#     - redis        shared rate-limit counters + response cache
#                    (WAF falls back to in-memory if absent)
#     - httpbin      mock upstream for smoke tests
#
# The WAF itself is NOT run inside this compose file during early
# development — run it from `cargo run -p aegis-bin` on the host so
# iteration is fast. Once we reach W5, a `waf` service will be added
# with `depends_on: { etcd: service_healthy }`.
#
# SECURITY NOTE. This file is DEV ONLY. etcd runs with
# `ALLOW_NONE_AUTHENTICATION=yes` — do not reuse these settings in
# production. The production stack (deploy/prod/, W5+) enables etcd
# client-cert auth, etcd-native role-based access, and TLS.

services:
  # ---------- CONTROL PLANE ----------

  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: aegis-etcd
    command:
      - /usr/local/bin/etcd
      - --name=aegis-etcd-0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=aegis-etcd-0=http://etcd:2380
      - --initial-cluster-state=new
      - --log-level=warn
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"   # DEV ONLY
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aegis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      etcd:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: aegis-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  # Grafana — operator visualization layer over Prometheus + Jaeger.
  # Anonymous editor access for dev convenience; locked down in
  # production deploys (set GF_AUTH_ANONYMOUS_ENABLED=false +
  # configure GF_SECURITY_ADMIN_PASSWORD via secret).
  #
  # Datasources + dashboards are file-provisioned from
  # `deploy/grafana/provisioning/{datasources,dashboards}/` and
  # `deploy/grafana/dashboards/` so a fresh `docker compose up`
  # comes up with the WAF / Redis / Runtime dashboards already
  # rendered — operators don't have to click through a wizard.
  grafana:
    image: grafana/grafana:10.4.2
    container_name: aegis-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"database\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis exporter — feeds the Redis dashboard. Optional but
  # default-on in dev so the dashboard isn't blank. Production
  # operators can omit by removing both this service and the
  # `aegis-redis` Prometheus job.
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: aegis-redis-exporter
    command:
      - --redis.addr=redis://redis:6379
    # Stays in sync with the optional `REDIS_PASSWORD` (empty in dev).
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  # ---------- DATA PLANE (optional) ----------

  # Optional counter store. Used by M2 for shared rate-limit
  # counters and by M1 for the smart-cache tier. The WAF MUST
  # function without Redis (falls back to InMemoryCounterStore).
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    # R-2/R-6 (2026-06-19): hardened config — protected-mode, REPLICAOF/CONFIG/
    # MODULE/DEBUG disabled (anti-hijack), persistence on. `REDIS_PASSWORD`
    # (optional in dev, REQUIRED in any non-loopback deploy) adds auth; when
    # unset, `--requirepass ""` is a no-op and loopback-only bind protects dev.
    command:
      - "redis-server"
      - "/etc/redis/redis.conf"
      - "--requirepass"
      - "${REDIS_PASSWORD:-}"
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      # PREREQ-A (redis-interim-durability P0): persist `/data` (redis.conf sets
      # `dir /data` + RDB save points) on a named volume so the config plane and
      # the durable `control:waf:*` keyspace survive a restart. Without it the
      # RDB snapshot lives on the ephemeral container layer and is lost on
      # `docker compose down`.
      - aegis-redis-data:/data
    # Publish to LOOPBACK ONLY — never 0.0.0.0 (that exposure is what got the
    # prod Redis hijacked). Cross-host access in the real cluster goes over the
    # private network + firewall, not a published port.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    container_name: aegis-httpbin
    ports:
      - "8081:8080"

  # ---------- HA cluster reference LB (HA-T1) ----------
  #
  # Health-checked round-robin in front of two WAF nodes that
  # the operator runs on the host (`config/cluster-{a,b}.yaml`).
  # Pulled by `tests/cluster/05-single-vip-baseline.sh` and
  # `06-mid-burst-failover.sh` to measure cluster SLOs through
  # a single VIP. Optional — if you don't pass
  # `--profile ha` only the rest of the stack comes up.
  #
  # See `plans/cluster-ingress-lb.md` and
  # `docs/operations/ha-clustering.md` § "Load balancer
  # patterns" for the design rationale.
  aegis-lb:
    image: haproxy:2.9-alpine
    container_name: aegis-lb
    profiles: ["ha"]
    ports:
      - "9180:9180"  # plaintext VIP
      - "9443:9443"  # TLS VIP (requires cert mount)
      - "8404:8404"  # stats endpoint (used by tests)
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../tests/fixtures/tls:/etc/haproxy/certs:ro
    extra_hosts:
      # Linux: `host.docker.internal` doesn't resolve by
      # default. This adds the gateway IP so the same hostname
      # the haproxy.cfg uses works on every platform.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8404/ | grep -q FRONTEND || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Security validation target (opt-in) ----------
  #
  # OWASP Juice Shop — deliberately vulnerable Node.js app
  # (https://github.com/juice-shop/juice-shop). Brought up only
  # with `--profile juice-shop`; idle otherwise so dev iteration
  # doesn't pay a 500 MB Node container's startup cost on every
  # `make run-dev`.
  #
  # Used as a real-world upstream behind the WAF for:
  #   - end-to-end detector validation (SQLi / XSS / IDOR / auth
  #     bypass / SSRF against a real app, not synthetic payloads)
  #   - false-positive checks against legitimate SPA / AJAX traffic
  #   - demo: "WAF blocks 30+ OWASP Top 10 exploits against a
  #     vulnerable app"
  #
  # Host port 3001 (grafana already owns 3000). To wire the WAF
  # at it, point a route at http://localhost:3001 in your config:
  #
  #   routes:
  #     - id: juice-shop
  #       prefix: /
  #       upstream: { url: "http://localhost:3001" }
  #
  # Image is pinned to :latest because the OWASP project tags
  # major-version releases inconsistently. For reproducible
  # benchmark runs, pin to a specific digest before recording
  # results (`docker pull bkimminich/juice-shop@sha256:...`).
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: aegis-juice-shop
    profiles: ["juice-shop"]
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/rest/admin/application-version | grep -q version || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  etcd-data:
  grafana-data:
  # PREREQ-A — durable Redis data (RDB). See the redis service comment above.
  aegis-redis-data:

networks:
  default:
    name: aegis-dev
