# HAProxy reference config for the Aegis-Gate cluster fixture
# (HA-T1 of `plans/cluster-ingress-lb.md`).
#
# Sits in front of two WAF nodes (waf-a:8080, waf-b:8090 on the
# host network) and provides:
#
#   - one VIP for client traffic (:9180 plaintext, :9443 TLS)
#   - health-checked round-robin balancing
#   - failover budget = `inter 2s × fall 2 = 4s`
#   - keep-alive connection pool to each backend
#   - a /stats page on :8404 used by tests/cluster/05 to assert
#     both backends served traffic
#
# Wired into deploy/docker-compose.dev.yml as the `aegis-lb`
# service. Out-of-tree operators reading this should treat it
# as a starting point — production setups want PROXY-protocol,
# stricter timeouts, and (probably) frontend-side rate limiting
# of their own.

global
  daemon
  maxconn 8192
  log stdout format raw local0 info

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client  60s
  timeout server  60s
  # Keep idle backend connections warm so we don't pay a
  # handshake on every single request.
  timeout http-keep-alive 60s
  option http-keep-alive
  retries 2

# ---------- Stats endpoint (used by tests) ----------
listen stats
  bind *:8404
  stats enable
  stats uri /
  stats refresh 5s
  stats show-legends
  # Plain CSV for scripts. `tests/cluster/05-single-vip-baseline.sh`
  # parses this to assert that both backends served traffic.
  stats admin if FALSE

# ---------- Plaintext VIP ----------
frontend in_http
  bind *:9180
  default_backend cluster_http

backend cluster_http
  # `leastconn` distributes by current open conns, which is the
  # right shape for HTTP-keep-alive clients (k6, web browsers,
  # API consumers): roundrobin only kicks per *new connection*,
  # so VU pools with persistent sockets concentrate skew on
  # whichever backend got the earlier connections. leastconn
  # rebalances continuously as backends absorb load.
  balance leastconn
  option httpchk
  http-check send meth GET uri /healthz/ready
  http-check expect status 200
  default-server check inter 2s fall 2 rise 1 maxconn 1024
  # `/healthz/ready` lives on the admin port (9443 for waf-a,
  # 9543 for waf-b); data plane is on 8080 / 8090. The `port`
  # arg on each server probes the admin port while traffic
  # still flows to the data port. `host.docker.internal` resolves
  # to the Docker host on macOS / Windows; Linux hosts pin
  # `--add-host` in the compose service so the same name resolves.
  server waf-a host.docker.internal:8080 port 9443
  server waf-b host.docker.internal:8090 port 9543

# ---------- TLS VIP ----------
# Optional — only active if /etc/haproxy/certs/cluster.pem
# exists. The compose mount is read-only and contains a
# concatenated chain (cert + key) generated from the
# tests/fixtures/tls fixture. If it's missing, HAProxy
# silently skips this frontend.
frontend in_tls
  bind *:9443 ssl crt /etc/haproxy/certs/haproxy.pem alpn h2,http/1.1
  default_backend cluster_http
