---
# Build the WAF binary ONCE on the builder host. Distributed to every node by
# the waf_node role (build-once-and-distribute). Runs on the `builder` group only.

- name: Compile the WAF release binary (one time, on the builder)
  ansible.builtin.command:
    cmd: cargo build -p aegis-bin --release --features "{{ waf_features }}"
    chdir: "{{ builder_repo }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  register: cargo_build
  changed_when: "'Compiling aegis-bin' in cargo_build.stderr or 'Finished' in cargo_build.stderr"

- name: Confirm the binary exists
  ansible.builtin.stat:
    path: "{{ builder_bin }}"
  register: bin_stat

- name: Fail if the build produced no binary
  ansible.builtin.assert:
    that: bin_stat.stat.exists
    fail_msg: "Build did not produce {{ builder_bin }} — check the cargo output."
    success_msg: "WAF binary ready: {{ builder_bin }} ({{ (bin_stat.stat.size / 1048576) | round(1) }} MB)"

# Zero Trust — generate the ONE shared WAF client identity (clientAuth) for the whole
# fleet, here on the builder. Idempotent (creates:), so it's made once and reused; the
# waf_node role copies the same cert+key to every node. Skipped if disabled.
- name: Generate the shared WAF client identity (Zero Trust upstream mTLS)
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -newkey rsa:2048 -nodes -days 825
      -keyout {{ waf_client_identity_src_key }}
      -out    {{ waf_client_identity_src_crt }}
      -subj "/CN=aegis-waf-client"
      -addext "extendedKeyUsage=clientAuth"
    creates: "{{ waf_client_identity_src_crt }}"
  when: zero_trust_upstream_identity_cert | default('', true) | length > 0
