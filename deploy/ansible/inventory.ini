# Aegis-Gate WAF fleet — Ansible inventory.
#
# `builder` = the host that compiles the binary ONCE (this infra host).
# `waf`     = every node that runs a WAF (incl. the infra node itself).
# node_id MUST be unique per node (it's the cluster identity).
#
# The infra host is the control node too → ansible_connection=local (no SSH to self).
# Remote nodes need key-based SSH from here (ansible_user + key already set up when
# you deployed them). Adjust ansible_user / ansible_ssh_private_key_file as needed.

[builder]
infra ansible_host=10.20.0.72 ansible_connection=local

[waf]
infra ansible_host=10.20.0.72 ansible_connection=local node_id=waf-infra-1
waf-2 ansible_host=10.20.0.21                            node_id=waf-2
waf-3 ansible_host=10.20.0.40                            node_id=waf-3

[waf:vars]
ansible_user=nico
ansible_ssh_private_key_file=~/.ssh/id_ed25519
