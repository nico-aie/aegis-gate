# OpenTelemetry Collector — optional middle layer between Aegis-Gate
# and SigNoz. Use this when you want PII redaction before egress and/or
# fan-out to more than one backend. For a simple dev setup the WAF can
# point straight at SigNoz's bundled collector instead (see
# ../signoz/README.md).
#
# Architecture:
#   WAF  --OTLP :4317-->  this Collector  --OTLP-->  SigNoz
#                           (scrape /metrics)
#
# Requires the otelcol-contrib distribution (the `redaction` and
# `prometheus` receiver/processors are contrib components).
#   docker run -v $PWD/collector.yaml:/etc/otelcol-contrib/config.yaml \
#     -p 4317:4317 -p 4318:4318 otel/opentelemetry-collector-contrib:0.103.0

receivers:
  # OTLP from the WAF (traces; metrics/logs once those phases land).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # P2 — METRICS. Pull the WAF's existing Prometheus /metrics and
  # convert to OTLP; no app change. The WAF serves /metrics on the
  # ADMIN listener (default :9443, see deploy/prometheus/prometheus.yml),
  # NOT a separate metrics port — match that target + the same labels.
  prometheus:
    config:
      scrape_configs:
        - job_name: aegis-waf
          metrics_path: /metrics
          scrape_interval: 15s
          static_configs:
            - targets: ["host.docker.internal:9443"]  # WAF admin /metrics
              labels:
                service: aegis-gate
                plane: data

  # P4 (2026-06-05) — per-node SYSTEM metrics (CPU / memory / disk / net).
  # `hostmetrics` describes whatever HOST the collector runs on. For true
  # per-node system info in a multi-node cluster, run this collector as an
  # AGENT on each WAF VM (one collector per node); `resourcedetection/system`
  # below then stamps each node's `host.name`, which lines up with the WAF's
  # own OTLP `host.name` resource attribute so SigNoz can join traffic +
  # system metrics per node. A single central collector reports only its own
  # host here, so deploy one agent per node for genuine per-node CPU/mem.
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      disk: {}
      filesystem: {}
      network: {}

  # P3 — LOGS. Tail the WAF's structured JSON log and convert to OTLP
  # log records. The WAF writes tracing logs as JSON to stdout; redirect
  # them to a file the collector can read, e.g.:
  #   ./waf run --config config/dev.yaml >> /var/log/aegis/waf.json 2>&1
  # (bind-mount that path into the collector container). Adjust `include`.
  filelog:
    include: ["/var/log/aegis/waf.json"]
    start_at: end
    operators:
      # Each line is a tracing-json record: { timestamp, level, fields, ... }
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999Z07:00"
        severity:
          parse_from: attributes.level

processors:
  # P4 (2026-06-05) — stamp host identity on hostmetrics so per-node CPU/mem
  # carries `host.name` and matches the WAF's OTLP `host.name`. Run per node
  # (agent topology). `env` lets you override with OTEL_RESOURCE_ATTRIBUTES
  # (e.g. host.name=waf-1) when the OS hostname isn't the node id you want.
  resourcedetection/system:
    detectors: [env, system]
    system:
      hostname_sources: [os]

  # PII guardrail: drop request attributes that may carry secrets/PII.
  # The WAF should also redact at source (dlp), but defence-in-depth.
  redaction:
    allow_all_keys: true
    blocked_values:
      - "(?i)bearer\\s+[a-z0-9._-]+"        # auth tokens
      - "[0-9]{13,19}"                       # PAN-like digit runs
      - "[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}" # emails
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: url.query
        action: delete
  batch:
    timeout: 5s

exporters:
  # SigNoz's OTLP ingest. Self-hosted: the signoz-otel-collector svc.
  # SigNoz Cloud: set endpoint to the region URL + the access-token header.
  otlp/signoz:
    endpoint: "signoz-otel-collector:4317"
    tls:
      insecure: true
    # headers:
    #   signoz-access-token: "${env:SIGNOZ_ACCESS_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [redaction, attributes/scrub, batch]
      exporters: [otlp/signoz]
    metrics:
      # `hostmetrics` adds per-node CPU/mem/disk/net; `resourcedetection`
      # stamps host.name on them so SigNoz groups system metrics per node.
      receivers: [otlp, prometheus, hostmetrics]
      processors: [resourcedetection/system, batch]
      exporters: [otlp/signoz]
    logs:
      # `redaction`/`attributes` scrub log *attributes*; body-level PII
      # (e.g. a token inside a message string) is best redacted at the
      # source via the WAF's `dlp` — keep sensitive values out of log
      # fields. The OTLP receiver also accepts logs if the app ever
      # switches to an app-side OTLP log exporter (P3 option 2).
      receivers: [otlp, filelog]
      processors: [redaction, attributes/scrub, batch]
      exporters: [otlp/signoz]
