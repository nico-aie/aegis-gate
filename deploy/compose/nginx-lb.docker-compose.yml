# nginx L4 (stream) load balancer for the WAF fleet — TEST/cluster harness.
#
# Fronts the WAF nodes (10.20.0.72:8080 + :8081) with a single VIP on :8088,
# round-robin per connection. TCP passthrough → WAF keeps TLS/JA3/all protocols.
# NOTE: SNATs the client (WAF sees nginx's IP) — see nginx-stream.conf. Unlike
# HAProxy+TPROXY this needs NO root/caps, so it runs under rootless Docker.
#
#   cd deploy/compose
#   docker compose -f nginx-lb.docker-compose.yml up -d
#   curl http://10.20.0.72:8088/        # → round-robins to a WAF node
name: aegis-nginx-lb

services:
  nginx-lb:
    image: nginx:1.27-alpine          # official image includes the stream module
    restart: unless-stopped
    volumes:
      # L4 stream passthrough (current): keeps WAF as TLS edge → JA3/JA4/device_fp,
      # cert on the WAF nodes, nginx holds none. Swap to nginx-http.conf for L7
      # (adds X-Forwarded-For, but terminates TLS → loses JA3/JA4).
      - ../nginx/nginx-stream.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Bind all interfaces (incl. 127.0.0.1) so SSH/VS Code port-forwards that
      # target the server's localhost:8088 reach it. (Was 10.20.0.72:8088 only,
      # which left loopback empty → forwarded requests hung.)
      - "56208:8088"                  # data VIP — host :56208 → nginx :8088 (TLS passthrough)
      # Per-node admin-console ports (one per node, NOT a pool) — QC forwards each
      # from this machine to test an individual node's dashboard. See nginx-stream.conf.
      - "56243:56243"                 # admin console → waf-infra-1 (10.20.0.72, this host)
      - "56244:56244"                 # admin console → waf-2       (10.20.0.21)
      - "56245:56245"                 # admin console → waf-3       (10.20.0.40)
