# Aegis-Gate INFRA HOST stack (DNS round-robin topology — no LB here).
#
# This host (10.20.0.72) runs the shared, stateful pieces of the fleet:
#   redis  — shared state (rate-limit · risk · config plane · leases · metrics)
#   mock   — multi-protocol upstream (http :9991 · ws :9992 · grpc :9993 · tcp :9994)
#
# SigNoz (traces/metrics/logs) is NOT here — it's a heavy separate stack run
# from its own compose (see deploy/signoz/README.md). It listens on :4317.
#
# WAF nodes live on OTHER machines and are the TLS edge (DNS round-robin to
# them; no HAProxy/TPROXY on this host — rootless Docker can't do TPROXY).
# Each WAF node points at:
#   WAF_STATE__REDIS__URLS = ["redis://10.20.0.72:6379"]
#   WAF_OBSERVABILITY__OTEL__ENDPOINT = http://10.20.0.72:4317   (SigNoz collector)
#   upstream pool → 10.20.0.72:9991 (http) / :9992 (ws) / :9993 (grpc) / :9994 (tcp)
#
#   cd deploy/compose
#   docker compose -f infra.docker-compose.yml up -d --build
#
# Ports are published on the host's private interface (10.20.0.72) so the
# remote WAF nodes can reach them. NOTE: this account has no firewall control
# (rootless, no sudo) — there is only the one lab NIC, so these ports are
# reachable by anything on 10.20.0.0/22. Lock them down at the network layer.
name: aegis-infra

services:
  redis:
    image: redis:7-alpine
    # Hardened (2026-06-18 hijack mitigation): AUTH + anti-hijack renames (redis.conf).
    # REDIS_PASSWORD comes from deploy/compose/.env (gitignored). Must match the fleet
    # nodes' WAF_STATE__REDIS__URLS (Ansible group_vars vault → each node's .env).
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/compose/.env}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 10
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "10.20.0.72:6379:6379"
    volumes:
      - ../redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-data:/data

  mock:
    build:
      context: ../mock
    # default CMD serves --http :9991 --ws :9992 --grpc :9993 --tcp :9994
    restart: unless-stopped
    ports:
      - "10.20.0.72:9991:9991"   # HTTP/1.1 + h2c
      - "10.20.0.72:9992:9992"   # WebSocket
      - "10.20.0.72:9993:9993"   # gRPC (HTTP/2)
      - "10.20.0.72:9994:9994"   # raw TCP

  # H2b — durable CONFIG-PLANE store (config:waf:doc + version snapshots +
  # control:waf:* ride etcd when config_plane.store=etcd). Distinct from Redis,
  # which still backs the data-plane hot path. Single node (one infra box):
  # durable via Raft WAL on the named volume, but NOT HA — if it's down the
  # config plane is read-only/stale; the hot path (Redis) keeps serving.
  # No auth (the WAF etcd-client config carries endpoints only); LAN-only,
  # published on the private IP like Redis. Harden with TLS+auth later.
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    command:
      - etcd
      - --name=aegis-etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://10.20.0.72:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://10.20.0.72:2380
      - --initial-cluster=aegis-etcd-1=http://10.20.0.72:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=aegis-etcd
      - --auto-compaction-retention=1
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "10.20.0.72:2379:2379"   # etcd v3 gRPC client API (config plane)
    volumes:
      - etcd-data:/etcd-data

volumes:
  redis-data: {}
  etcd-data: {}
