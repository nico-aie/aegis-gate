[workspace]
members = [
    "crates/aegis-core",
    "crates/aegis-proxy",
    "crates/aegis-security",
    "crates/aegis-control",
    "crates/aegis-bin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Runtime & async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
num_cpus = "1"

# HTTP
http = "1"
bytes = "1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "client", "client-legacy"] }
http-body = "1"
http-body-util = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Crypto
blake3 = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Identifiers — UUID v4 for `X-WAF-Request-Id` (v2.3 §5.1). `v4`
# pulls in `getrandom`, which gives cryptographically-random IDs
# without collisions under burst load. Earlier code used a
# `blake3(peer:nanos:path)` hash; that's deterministic on
# `(peer, nanos, path)` and collides on nanosecond ties at high RPS.
uuid = { version = "1", features = ["v4"] }

# Base32 (RFC 4648) for TOTP shared-secret encoding/decoding.
# Authenticator apps consume the `otpauth://` URI's `secret=...`
# parameter as RFC 4648 base32; pre-2026-05-17 the WAF emitted a
# lossy byte-modulo-32 character mapping that didn't round-trip,
# so codes never matched. F-CRITICAL-003 fix uses this crate for
# real encode/decode.
base32 = "0.5"

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-tokio", "tls12"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = "0.13"
x509-parser = "0.16"

# Config
figment = { version = "0.10", features = ["yaml", "env"] }
arc-swap = "1"
notify = "6"

# Concurrency
dashmap = "6"
# moka removed 2026-05-11 — the TierCache module that consumed it
# had zero call sites in the request pipeline (PROXY-08/09).
parking_lot = "0.12"

# Matching
regex = "1"
ipnet = { version = "2", features = ["serde"] }
aho-corasick = "1"
globset = "0.4"

# PROXY protocol (L4 real-client-IP) — pure-Rust v1+v2 header parser.
# We own the bounded async read; `ppp` only parses the exact header
# bytes we hand it. Pinned; surfaced to `cargo deny`/`cargo audit`.
ppp = "=2.3.0"

# Observability
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Error handling
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Auth
jsonwebtoken = "9"

# Streams
tokio-stream = { version = "0.1", features = ["sync", "time"] }

# Testing
tokio-test = "0.4"
tokio-tungstenite = "0.24"

# Duration parsing
humantime = "2"
humantime-serde = "1"

# ACME / Let's Encrypt
# Pin to aws-lc-rs to match the rest of the workspace's rustls
# crypto provider — instant-acme's default is `ring`, which would
# leave rustls unable to pick a process-level provider.
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }

# Redis state backend (B1-T1 — Phase B). Pulled in only via the
# `aegis-proxy/redis` feature so single-node builds still compile
# without a Redis dep tree.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "script"] }
deadpool-redis = { version = "0.18", default-features = false, features = ["rt_tokio_1"] }

# HTTP client for secret-manager integrations (B2 — Phase B).
# Pulled only when an operator opts into a remote secrets backend
# (vault / aws / gcp / azure). `default-features = false` skips
# native-tls; we reuse the workspace rustls stack via `rustls-tls`
# so secret-manager calls share the same TLS provider as the
# rest of the gateway.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# AWS Secrets Manager resolver (B2-T2 — Phase B). Pulled only via
# the `aegis-proxy/aws` feature. We pin the SDK to the
# `behavior-version-latest` to avoid the build-time deprecation
# warning while keeping behaviour stable across minor version
# bumps. `aws-config` carries the credential chain (env, profile,
# IMDSv2, web-identity for EKS IRSA) so operators don't have to
# wire any of it themselves.
aws-config = { version = "1.5", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls", "credentials-process", "sso"] }
aws-sdk-secretsmanager = { version = "1.49", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }

# GCP Secret Manager resolver (B2-T3 — Phase B). REST-based
# (`reqwest`) with `gcp_auth` for Application Default
# Credentials — covers env var (`GOOGLE_APPLICATION_CREDENTIALS`),
# GKE workload identity, and gcloud user creds. Avoids the gRPC
# stack the official `google-cloud-secret-manager` crate would
# pull (tonic + prost). `base64` decodes the API's payload.
gcp_auth = { version = "0.12", default-features = false, features = ["webpki-roots"] }
base64 = "0.22"

# H2b P2 — native etcd v3 gRPC client (KV / Txn / Watch / Lease) for the
# durable config-plane backend. Pulled ONLY via aegis-proxy's default-off
# `etcd_config` feature. Reuses the tonic 0.12 / prost 0.13 tree already in
# the lock (via the otel stack), so it adds the etcd protobufs, not a second
# gRPC runtime.
etcd-client = { version = "0.14", default-features = false, features = ["tls"] }

# MaxMind GeoIP2 reader (B3-T3 — Phase B). Pulled only via the
# `aegis-security/geoip` feature. Pure-Rust mmap reader for
# `.mmdb` files — works for both GeoLite2-Country and
# GeoLite2-ASN.
maxminddb = "0.24"

# ONNX Runtime (AI-T) — Microsoft's native ORT shipped via the
# `ort` Rust crate.  Pulled only when `aegis-security/ai` is
# enabled.  Downloads the platform-native ORT binary on first
# build (~50 MB).  Faster + broader op-set support than the
# pure-Rust alternatives, matches the runtime the operator
# validated their model against.
# load-dynamic: dlopen libonnxruntime.so at runtime (via ORT_DYLIB_PATH)
# instead of linking ort's PREBUILT static lib, which requires glibc >=2.38
# and fails to link on glibc 2.35/2.36 hosts (undefined __isoc23_strtoll).
# Provide a glibc-compatible onnxruntime 1.22 .so + ORT_DYLIB_PATH at runtime;
# the `ai` ONNX detector is off by default, so the WAF runs fine without it.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "api-24", "load-dynamic"] }
ndarray = "0.17"
# Inbound request-body decompression for the AI detector (gzip/deflate). Pulled
# only via the aegis-security `ai` feature so non-AI builds stay slim.
flate2 = "1"

# HTTP/3 stack (B5-T1 — Phase B). Pulled only via the
# `aegis-proxy/http3` feature so the QUIC dep tree (quinn + h3)
# stays out of single-protocol builds. Versions pinned to the
# combination that builds cleanly against rustls 0.23.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

# DNS-resolved upstream members — Phase 2 (PR-DNS-2, 2026-05-11).
# Pure-Rust, async, TTL-aware resolver. Pulled unconditionally
# (not feature-gated) — ~80 KB compiled, and the feature is small
# enough that operators shouldn't need an opt-out. `tokio-runtime`
# binds the resolver to the tokio reactor; `system-config`
# parses /etc/resolv.conf at process start. We disable `tls`
# / `dns-over-https` etc. — the WAF talks to its local stub
# resolver, which already does the DoT/DoH dance if configured.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
