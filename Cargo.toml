[workspace]
members = [
    "crates/aegis-core",
    "crates/aegis-proxy",
    "crates/aegis-security",
    "crates/aegis-control",
    "crates/aegis-bin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Runtime & async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
num_cpus = "1"

# HTTP
http = "1"
bytes = "1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "client", "client-legacy"] }
http-body = "1"
http-body-util = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Crypto
blake3 = "1"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-tokio", "tls12"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = "0.13"
x509-parser = "0.16"

# Config
figment = { version = "0.10", features = ["yaml", "env"] }
arc-swap = "1"
notify = "6"

# Concurrency
dashmap = "6"
moka = { version = "0.12", features = ["future"] }
parking_lot = "0.12"

# Matching
regex = "1"
ipnet = { version = "2", features = ["serde"] }
aho-corasick = "1"
globset = "0.4"

# Observability
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Error handling
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Auth
jsonwebtoken = "9"

# Streams
tokio-stream = { version = "0.1", features = ["sync", "time"] }

# Testing
tokio-test = "0.4"
tokio-tungstenite = "0.24"

# Duration parsing
humantime = "2"
humantime-serde = "1"

# ACME / Let's Encrypt
# Pin to aws-lc-rs to match the rest of the workspace's rustls
# crypto provider — instant-acme's default is `ring`, which would
# leave rustls unable to pick a process-level provider.
instant-acme = { version = "0.7", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }

# Redis state backend (B1-T1 — Phase B). Pulled in only via the
# `aegis-proxy/redis` feature so single-node builds still compile
# without a Redis dep tree.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "script"] }
deadpool-redis = { version = "0.18", default-features = false, features = ["rt_tokio_1"] }

# HTTP client for secret-manager integrations (B2 — Phase B).
# Pulled only when an operator opts into a remote secrets backend
# (vault / aws / gcp / azure). `default-features = false` skips
# native-tls; we reuse the workspace rustls stack via `rustls-tls`
# so secret-manager calls share the same TLS provider as the
# rest of the gateway.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# AWS Secrets Manager resolver (B2-T2 — Phase B). Pulled only via
# the `aegis-proxy/aws` feature. We pin the SDK to the
# `behavior-version-latest` to avoid the build-time deprecation
# warning while keeping behaviour stable across minor version
# bumps. `aws-config` carries the credential chain (env, profile,
# IMDSv2, web-identity for EKS IRSA) so operators don't have to
# wire any of it themselves.
aws-config = { version = "1.5", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls", "credentials-process", "sso"] }
aws-sdk-secretsmanager = { version = "1.49", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }

# GCP Secret Manager resolver (B2-T3 — Phase B). REST-based
# (`reqwest`) with `gcp_auth` for Application Default
# Credentials — covers env var (`GOOGLE_APPLICATION_CREDENTIALS`),
# GKE workload identity, and gcloud user creds. Avoids the gRPC
# stack the official `google-cloud-secret-manager` crate would
# pull (tonic + prost). `base64` decodes the API's payload.
gcp_auth = { version = "0.12", default-features = false, features = ["webpki-roots"] }
base64 = "0.22"

# MaxMind GeoIP2 reader (B3-T3 — Phase B). Pulled only via the
# `aegis-security/geoip` feature. Pure-Rust mmap reader for
# `.mmdb` files — works for both GeoLite2-Country and
# GeoLite2-ASN.
maxminddb = "0.24"

# ONNX Runtime (AI-T) — Microsoft's native ORT shipped via the
# `ort` Rust crate.  Pulled only when `aegis-security/ai` is
# enabled.  Downloads the platform-native ORT binary on first
# build (~50 MB).  Faster + broader op-set support than the
# pure-Rust alternatives, matches the runtime the operator
# validated their model against.
ort = { version = "=2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
ndarray = "0.17"

# HTTP/3 stack (B5-T1 — Phase B). Pulled only via the
# `aegis-proxy/http3` feature so the QUIC dep tree (quinn + h3)
# stays out of single-protocol builds. Versions pinned to the
# combination that builds cleanly against rustls 0.23.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
